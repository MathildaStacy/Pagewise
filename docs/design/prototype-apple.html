<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagewise 可交互原型 · 苹果风（glass）</title>
<style>
/* Pagewise 苹果风原型 · 基础：Token、手机外框、顶栏 / Tab 栏、通用组件（glass 皮肤） */
/* L1 Token：取自 explore/src/apple.html，缺的按 02-skins §4.3 补齐 */
:root{
  --bg:#F2F2F7;--bg2:#FFFFFF;--fill:rgba(120,120,128,.14);--fill2:rgba(120,120,128,.08);--pressed:rgba(120,120,128,.12);
  --label:#000;--label2:rgba(60,60,67,.62);--label3:rgba(60,60,67,.32);--sep:rgba(60,60,67,.16);
  --tint:#007AFF;--tint-bg:rgba(0,122,255,.11);--tint-ink:#0058B9;
  --indigo:#5856D6;--indigo-bg:rgba(88,86,214,.11);
  --purple:#AF52DE;--purple-bg:rgba(175,82,222,.09);--teal:#0A9CB5;--teal-bg:rgba(48,176,199,.11);
  --orange:#E07A00;--orange-bg:rgba(255,149,0,.13);--orange-ink:#8A4B00;
  --green:#34C759;--green-bg:rgba(52,199,89,.13);--green-ink:#1E8A3C;
  --red:#FF3B30;--red-bg:rgba(255,59,48,.1);--red-ink:#C4170C;
  --hl:rgba(255,204,0,.32);--pin:#8A5A00;--pin-bg:rgba(255,204,0,.2);
  --glass:rgba(255,255,255,.66);--glass-hi:rgba(255,255,255,.9);--glass-line:rgba(255,255,255,.75);
  --glass-sh:0 8px 28px rgba(0,0,0,.10),0 1px 3px rgba(0,0,0,.06);
  --bar:rgba(249,249,251,.8);--page:#FFFFFF;--thumb:#FFFFFF;--scrim:rgba(0,0,0,.22);--sw-off:rgba(120,120,128,.16);
  --fz-ai:17px;--fz-book:17px;
  --sf:-apple-system,"SF Pro Text","SF Pro Display","PingFang SC","Helvetica Neue",system-ui,sans-serif;
  --serif:"Songti SC","Noto Serif SC","STSong",ui-serif,serif;
  --rounded:ui-rounded,"SF Pro Rounded",-apple-system,"PingFang SC",sans-serif;
  --ease:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#000;--bg2:#1C1C1E;--fill:rgba(120,120,128,.28);--fill2:rgba(120,120,128,.18);--pressed:rgba(120,120,128,.24);
  --label:#fff;--label2:rgba(235,235,245,.62);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.55);
  --tint:#0A84FF;--tint-bg:rgba(10,132,255,.2);--tint-ink:#5EB0FF;
  --indigo:#7D7AFF;--indigo-bg:rgba(94,92,230,.22);
  color-scheme:dark;
}
[data-theme=dark]{
  --purple:#DA8FFF;--purple-bg:rgba(191,90,242,.16);--teal:#5DE0F5;--teal-bg:rgba(64,200,224,.14);
  --orange:#FF9F0A;--orange-bg:rgba(255,159,10,.16);--orange-ink:#FFB340;
  --green:#30D158;--green-bg:rgba(48,209,88,.16);--green-ink:#30D158;
  --red:#FF453A;--red-bg:rgba(255,69,58,.16);--red-ink:#FF6961;
  --hl:rgba(255,214,10,.26);--pin:#FFD60A;--pin-bg:rgba(255,214,10,.14);
  --glass:rgba(40,40,44,.62);--glass-hi:rgba(44,44,48,.92);--glass-line:rgba(255,255,255,.12);
  --glass-sh:0 8px 28px rgba(0,0,0,.5);
  --bar:rgba(22,22,24,.78);--page:#1C1C1E;--thumb:#636366;--scrim:rgba(0,0,0,.45);--sw-off:rgba(120,120,128,.32);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sf);background:#E4E4EA;color:var(--label);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45;transition:background .3s}
[data-theme=dark] body{background:#111114}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:10px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.n{font-variant-numeric:tabular-nums}
.muted{color:var(--label2)}
.math{font-family:"Times New Roman","STIX Two Math",ui-serif,serif;font-style:italic;font-size:1.06em;white-space:nowrap}
.math.blk{display:block;text-align:center;margin:10px 0;font-size:1.14em;white-space:normal}

/* ---------- 舞台与手机 ---------- */
.stage{min-height:100%;display:flex;gap:40px;justify-content:center;align-items:flex-start;padding:28px 16px}
.phone{width:390px;height:844px;flex:none;position:relative;overflow:hidden;border-radius:56px;background:var(--bg);
  box-shadow:0 0 0 11px #1A1A1C,0 0 0 13px #3A3A3E,0 30px 80px rgba(0,0,0,.35);transition:background .3s}
#view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
#view::-webkit-scrollbar{display:none}
#head{position:absolute;top:0;left:0;right:0;z-index:10;transition:background .25s,box-shadow .25s}
#head.scrolled{background:var(--bar);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:0 .5px 0 var(--sep)}
.sbar{height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 40px;font:600 17px var(--sf);position:relative}
.sbar .island{position:absolute;left:50%;top:11px;width:124px;height:36px;border-radius:20px;background:#000;transform:translateX(-50%)}
.sbar .r{display:flex;gap:6px;align-items:center}
.sbar .r svg{height:12px;width:auto;fill:currentColor}
.homebar{position:absolute;left:50%;bottom:8px;width:136px;height:5px;border-radius:3px;background:var(--label);transform:translateX(-50%);z-index:40;opacity:.85;pointer-events:none}

/* ---------- 顶栏 AppBar ---------- */
#nav{height:44px;display:flex;align-items:center;padding:0 8px;gap:2px}
#nav .l,#nav .r{min-width:88px;display:flex;align-items:center;flex:none}
#nav .r{justify-content:flex-end;gap:0}
#nav .ttl{flex:1;min-width:0;text-align:center;line-height:1.2}
#nav .ttl b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nav .ttl small{display:block;font-size:11px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nav.root .ttl{opacity:0;transition:opacity .2s}
#head.past #nav.root .ttl{opacity:1}
.back{height:44px;display:flex;align-items:center;color:var(--tint);font-size:17px;max-width:120px;padding-right:4px}
.back svg.i{width:27px;height:27px;stroke-width:2.3;margin-left:-3px}
.back span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb{width:44px;height:44px;display:grid;place-items:center;color:var(--tint);border-radius:22px;flex:none}
.nb svg.i{width:24px;height:24px}
.nb:active,.nt:active,.back:active{opacity:.5}
.nt{height:44px;padding:0 8px;color:var(--tint);font-size:17px;white-space:nowrap}
.lt{font-size:34px;font-weight:700;letter-spacing:.01em;line-height:1.2;padding:0 20px 12px}
/* 读书 | 听讲 分段控件（顶栏右侧） */
.mode{position:relative;display:flex;height:32px;padding:2px;border-radius:16px;background:var(--fill);flex:none}
.mode .thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc(50% - 2px);border-radius:14px;background:var(--thumb);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.mode .thumb.listen{left:50%}
.mode.slide .thumb.read{animation:slideL .38s var(--ease)}
.mode.slide .thumb.listen{animation:slideR .38s var(--ease)}
@keyframes slideL{from{transform:translateX(100%)}}
@keyframes slideR{from{transform:translateX(-100%)}}
.mode button{position:relative;width:46px;font-size:13px;font-weight:500;border-radius:14px;text-align:center}
.mode button.on{font-weight:600;cursor:default}

/* ---------- Tab 栏（悬浮胶囊毛玻璃）与悬浮按钮 ---------- */
.gl{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:var(--glass-sh),inset 0 0 0 .5px var(--glass-line)}
#tabbar{position:absolute;left:22px;right:22px;bottom:24px;height:62px;border-radius:31px;display:flex;padding:4px;z-index:7}
#tabbar:empty{display:none}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;font-weight:600;color:var(--label);border-radius:27px;position:relative;transition:background .3s,transform .2s}
#tabbar button svg.i{width:24px;height:24px;stroke-width:1.8}
#tabbar button.on{color:var(--tint);background:var(--fill2)}
#tabbar button:active{transform:scale(.94)}
.badge{position:absolute;top:5px;left:calc(50% + 7px);background:var(--red);color:#fff;font:600 11px/17px var(--sf);min-width:17px;border-radius:9px;padding:0 5px;text-align:center}
#fab:empty{display:none}
.fab{position:absolute;right:22px;bottom:104px;z-index:7;height:50px;padding:0 20px 0 16px;border-radius:25px;background:var(--tint);color:#fff;font-weight:600;font-size:16px;display:flex;align-items:center;gap:6px;box-shadow:0 8px 24px rgba(0,122,255,.32),inset 0 0 0 .5px rgba(255,255,255,.3);transition:transform .2s}
.fab svg.i{stroke-width:2.4}
.fab:active{transform:scale(.95)}

/* ---------- 分组列表 ListSection / Row ---------- */
.grp{margin:0 16px 24px}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--label2);padding:0 16px 7px}
.grp-h.big{font-size:20px;font-weight:700;color:var(--label);padding:0 4px 8px}
.grp-h.big small{font-size:13px;font-weight:400;color:var(--label2)}
.grp-f{font-size:13px;color:var(--label2);padding:7px 16px 0;line-height:1.45}
.list{background:var(--bg2);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:50px;padding:11px 16px;position:relative;width:100%;text-align:left;background:var(--bg2)}
.row+.row::before,.row+.fld::before,.fld+.row::before,.fld+.fld::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);height:.5px;background:var(--sep)}
.list.ic{--inset:58px}
.row.tap{cursor:pointer}
.row.tap:active{background:var(--pressed)}
.row .grow{flex:1;min-width:0}
.row .grow>b{display:block;font-weight:400;font-size:17px;line-height:1.3}
.row .grow>small{display:block;font-size:13px;color:var(--label2);margin-top:2px;line-height:1.4}
.row .val{color:var(--label2);font-size:15px;white-space:nowrap;flex:none}
.row .chev{color:var(--label3);flex:none;width:15px;height:15px;stroke-width:2.6;margin-right:-4px}
.row.link{color:var(--tint);font-size:17px;justify-content:center}
.row.link.l{justify-content:flex-start}
.ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.ico svg.i{width:18px;height:18px;stroke-width:2}

/* ---------- 按钮、提示、标签、分段、开关、输入 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:50px;padding:0 22px;border-radius:25px;background:var(--fill);color:var(--tint);font-size:17px;font-weight:600;transition:transform .2s,opacity .2s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--tint);color:#fff}
.btn.dt{background:var(--indigo);color:#fff}
.btn.danger{color:var(--red)}
.btn.text{background:none;padding:0 8px}
.btn.sm{height:34px;padding:0 14px;font-size:15px;border-radius:17px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.btn svg.i{width:18px;height:18px;stroke-width:2.3}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:13px;line-height:1.55;padding:10px 14px;border-radius:14px;background:var(--fill2);color:var(--label2)}
.note.acc{background:var(--tint-bg);color:var(--tint-ink)}
.note.warn{background:var(--orange-bg);color:var(--orange-ink)}
.note.bad{background:var(--red-bg);color:var(--red-ink)}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:10px;font-size:11px;font-weight:600;background:var(--fill2);color:var(--label2);vertical-align:1px;white-space:nowrap}
.tag.acc{background:var(--tint-bg);color:var(--tint)}
.tag.ok{background:var(--green-bg);color:var(--green-ink)}
.tag.stuck{background:var(--orange-bg);color:var(--orange-ink)}
.tag.dt{background:var(--indigo-bg);color:var(--indigo)}
.seg{--n:2;--i:0;position:relative;display:flex;height:32px;padding:2px;border-radius:16px;background:var(--fill)}
.seg .thumb{position:absolute;top:2px;bottom:2px;width:calc((100% - 4px) / var(--n));left:calc(2px + (100% - 4px) / var(--n) * var(--i));border-radius:14px;background:var(--thumb);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);transition:left .38s var(--ease)}
.seg button{flex:1;position:relative;font-size:13px;font-weight:500;border-radius:14px;text-align:center;white-space:nowrap}
.seg button.on{font-weight:600}
.sw{width:51px;height:31px;border-radius:16px;background:var(--sw-off);position:relative;flex:none;cursor:pointer;transition:background .25s}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:left .3s var(--ease)}
.sw.on{background:var(--green)}
.sw.on::after{left:22px}
.fld{display:block;padding:10px 16px 11px;position:relative;background:var(--bg2)}
.fld label{display:block;font-size:13px;color:var(--label2);margin-bottom:3px}
.fld input,.fld select,.fld textarea{width:100%;font-size:17px;background:none}
.fld select{-webkit-appearance:none;appearance:none;color:var(--tint);cursor:pointer}
.fld textarea{min-height:84px;resize:vertical;line-height:1.5}
.fld input::placeholder,.fld textarea::placeholder,.edt::placeholder{color:var(--label3)}
.fld input[disabled]{color:var(--label3)}
.box{height:34px;border-radius:10px;background:var(--fill2);padding:0 10px;font-size:16px;text-align:center}
.edt{display:block;width:100%;border-radius:16px;background:var(--bg2);padding:13px 16px;line-height:1.6;font-size:16px;min-height:120px;resize:vertical}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--tint);transition:width .4s var(--ease)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;display:inline-block}
.empty{padding:40px 24px;text-align:center;color:var(--label2);font-size:15px}
.pad{padding:0 16px}
.enter{animation:rise .42s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

/* ---------- 浮层：Sheet（悬浮 40 圆角）、Dialog（iOS alert）、Toast（HUD）、编辑菜单 ---------- */
#overlay{position:absolute;inset:0;z-index:20;pointer-events:none}
#overlay:empty{display:none}
#overlay.show{pointer-events:auto}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .3s}
#overlay.show .scrim{opacity:1}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;max-height:84%;display:flex;flex-direction:column;border-radius:40px;background:var(--glass-hi);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:0 20px 60px rgba(0,0,0,.25),inset 0 0 0 .5px var(--glass-line);
  transform:translateY(110%);transition:transform .46s var(--ease);touch-action:none}
#overlay.show .sheet{transform:none}
.sheet.drag{transition:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:7px auto 0;flex:none;cursor:grab}
.sh{text-align:center;padding:10px 52px 8px;flex:none;position:relative}
.sh b{font-size:17px;font-weight:600;line-height:1.3;display:block}
.sh small{display:block;font-size:12px;color:var(--label2);margin-top:2px}
.sh .x{position:absolute;right:14px;top:6px;width:32px;height:32px;border-radius:16px;background:var(--fill);color:var(--label2);display:grid;place-items:center}
.sh .x svg.i{width:15px;height:15px;stroke-width:2.6}
.sb{overflow-y:auto;padding:4px 18px 6px;min-height:0;touch-action:pan-y;scrollbar-width:none}
.sb::-webkit-scrollbar{display:none}
.sb .list{background:var(--bg2)}
.sp{font-size:16px;line-height:1.6;margin:4px 2px 10px}
.sp.quote{font-family:var(--serif);color:var(--label2);font-size:15px;line-height:1.8;border-left:3px solid var(--hl);padding-left:12px;margin-left:0}
.sub{font-size:13px;color:var(--label2);font-weight:600;margin:12px 4px 6px}
.sf{display:flex;flex-direction:column;gap:8px;padding:12px 16px 18px;flex:none}
.dlgw{position:absolute;inset:0;display:grid;place-items:center;padding:0 40px}
.dlg{width:100%;max-width:300px;border-radius:28px;overflow:hidden;background:var(--glass-hi);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 20px 60px rgba(0,0,0,.25),inset 0 0 0 .5px var(--glass-line);transform:scale(1.12);opacity:0;transition:transform .32s var(--ease),opacity .2s}
#overlay.show .dlg{transform:none;opacity:1}
.dlg .dh{padding:20px 18px 2px;font-weight:600;font-size:17px;text-align:center;line-height:1.3}
.dlg .db{padding:6px 18px 18px;font-size:13px;line-height:1.55;text-align:center}
.dlg .db .edt{text-align:left;margin-top:10px;font-size:15px;min-height:96px;background:var(--fill2)}
.dlg .db .sp.quote{text-align:left;font-size:13px}
.dlg .df{display:flex;border-top:.5px solid var(--sep)}
.dlg .df.v{flex-direction:column}
.dlg .df button{flex:1;height:46px;font-size:17px;color:var(--tint);text-align:center}
.dlg .df button+button{border-left:.5px solid var(--sep)}
.dlg .df.v button+button{border-left:0;border-top:.5px solid var(--sep)}
.dlg .df .pri{font-weight:600}
.dlg .df .danger{color:var(--red)}
.dlg .df button:active{background:var(--pressed)}
#toast{position:absolute;left:50%;top:60px;z-index:30;transform:translate(-50%,-14px);opacity:0;pointer-events:none;max-width:340px;padding:10px 18px;border-radius:22px;font-size:14px;font-weight:500;text-align:center;
  background:var(--glass-hi);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:var(--glass-sh),inset 0 0 0 .5px var(--glass-line);transition:all .35s var(--ease);display:flex;align-items:center;gap:7px}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast svg.i{width:17px;height:17px;stroke-width:2.6}
#toast.ok svg.i{color:var(--green)}
#toast.dt svg.i{color:var(--indigo)}
#toast.bad svg.i{color:var(--red)}
.emenu{position:absolute;z-index:15;display:flex;max-width:calc(100% - 16px);overflow-x:auto;scrollbar-width:none;border-radius:14px;padding:0;background:var(--glass-hi);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 10px 30px rgba(0,0,0,.18),inset 0 0 0 .5px var(--glass-line);animation:pop .22s var(--ease)}
.emenu::-webkit-scrollbar{display:none}
.emenu button{flex:none;height:40px;padding:0 11px;font-size:14px;white-space:nowrap}
.emenu button+button{border-left:.5px solid var(--sep)}
.emenu button:active{background:var(--pressed)}
@keyframes pop{from{opacity:0;transform:scale(.9)}}

/* ---------- 原型控制台 ---------- */
.console{width:320px;flex:none;font-size:14px;line-height:1.55;position:sticky;top:28px;max-height:calc(100vh - 56px);overflow:auto;scrollbar-width:none;color:var(--label)}
.console h1{font-size:26px;font-weight:700;letter-spacing:-.01em}
.console .lead{color:var(--label2);margin:4px 0 14px;font-size:13px}
.console h2{font-size:13px;color:var(--label2);font-weight:600;margin:16px 0 7px}
.console .tg{display:inline-flex;background:var(--fill);border-radius:17px;padding:2px}
.console .tg button{height:30px;padding:0 14px;border-radius:15px;font-size:13px;font-weight:500}
.console .tg button.on{background:var(--thumb);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.console .jump{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.console .jump button{background:var(--bg2);border-radius:14px;padding:8px 11px;font-size:13px;font-weight:600;line-height:1.35}
.console .jump button small{display:block;color:var(--label2);font-size:11px;font-weight:400}
.console .jump button:active{transform:scale(.97)}
.console .pgs{display:flex;flex-wrap:wrap;gap:5px}
.console .pgs button{font-size:12px;padding:4px 10px;border-radius:13px;background:var(--bg2)}
.console .pgs button.on{background:var(--tint);color:#fff}
.console p{font-size:12px;color:var(--label2);margin:5px 0}
.console a{color:var(--tint);text-decoration:none}
.console .rst{width:100%;margin-top:14px;height:36px;border-radius:18px;background:var(--bg2);font-size:13px;color:var(--red)}
@media (max-width:780px){.stage{flex-direction:column;align-items:center}.console{position:static;width:390px;max-height:none}}
@media (max-width:430px){.stage{padding:0}.phone{width:100vw;height:100vh;border-radius:0;box-shadow:none}.console{width:100%;padding:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Pagewise 苹果风原型 · 各页面 */
/* ---------- 书架 ---------- */
.cont{display:block;width:calc(100% - 32px);margin:0 16px 26px;text-align:left;border-radius:26px;padding:18px 18px 16px;color:#fff;cursor:pointer;position:relative;overflow:hidden;
  background:linear-gradient(140deg,#3D8BFF 0%,#007AFF 45%,#4B4ACF 100%);box-shadow:0 14px 34px rgba(0,122,255,.28);transition:transform .2s}
[data-theme=dark] .cont{background:linear-gradient(140deg,#1F6FE0 0%,#0A5CD0 45%,#3C3AA8 100%);box-shadow:0 14px 34px rgba(0,0,0,.5)}
.cont:active{transform:scale(.985)}
.cont .k{font-size:13px;opacity:.85;font-weight:500}
.cont .t{font-size:24px;font-weight:700;margin:4px 0 2px;letter-spacing:-.01em}
.cont .b{font-size:13px;opacity:.85}
.cont .s{margin-top:12px;font-size:13px;line-height:1.5;background:rgba(255,255,255,.16);border-radius:14px;padding:9px 12px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.25)}
.cont .go{margin-top:14px;display:flex;justify-content:space-between;align-items:center}
.cont .pts{display:flex;gap:5px;align-items:center;font-size:13px}
.cont .pts i{width:22px;height:6px;border-radius:3px;background:rgba(255,255,255,.3)}
.cont .pts i.on{background:#fff}
.cont .pts span{margin-left:6px;opacity:.9}
.cont .gob{height:36px;padding:0 16px;border-radius:18px;background:#fff;color:#007AFF;font-weight:600;font-size:15px;display:flex;align-items:center;gap:2px}
.cont .gob svg.i{width:16px;height:16px;stroke-width:2.6}
.book{display:flex;gap:14px;align-items:center;padding:12px 16px;width:100%;text-align:left;position:relative;background:var(--bg2);cursor:pointer}
.book+.book::before{content:"";position:absolute;top:0;right:0;left:84px;height:.5px;background:var(--sep)}
.book:active{background:var(--pressed)}
.book .grow{flex:1;min-width:0}
.book .tt{font-weight:600;font-size:16px;line-height:1.35}
.book .meta{font-size:13px;color:var(--label2);margin-top:1px}
.book .st{font-size:13px;margin-top:6px;display:flex;align-items:center;gap:6px;color:var(--label2)}
.cover{width:54px;height:74px;border-radius:7px;flex:none;display:flex;align-items:flex-end;padding:6px;color:#fff;font-size:10px;line-height:1.25;font-weight:700;position:relative;overflow:hidden;
  box-shadow:0 4px 10px rgba(0,0,0,.16),inset 0 0 0 .5px rgba(0,0,0,.1)}
.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(0,0,0,.22) 0 5%,rgba(255,255,255,.18) 7%,transparent 30%,rgba(255,255,255,.08))}
.cover span{position:relative}
.cover.lg{width:62px;height:84px}
.fic{width:40px;height:50px;border-radius:9px;background:var(--red);color:#fff;display:grid;place-items:center;font:700 11px var(--rounded);flex:none}
.fic.epub{background:var(--green)}

/* ---------- 解析设置 / 进度 ---------- */
.fhead{display:flex;gap:14px;align-items:center;padding:4px 20px 18px}
.fhead b{font-size:20px;font-weight:700;line-height:1.3;display:block}
.fhead small{font-size:13px;color:var(--label2)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 16px 24px}
.facts div{background:var(--bg2);border-radius:18px;padding:11px 14px;font-size:12px;color:var(--label2)}
.facts b{display:block;color:var(--label);font-size:17px;font-weight:600;margin-top:1px}
.facts b.ok{color:var(--green-ink)}.facts b.no{color:var(--orange)}
.part{padding:14px 16px;background:var(--bg2);position:relative}
.part+.part::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.part .l1{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:16px}
.stg{display:flex;gap:4px;margin-top:10px}
.stg span{flex:1;text-align:center;height:24px;line-height:24px;border-radius:12px;background:var(--fill2);font-size:11px;color:var(--label2)}
.stg span.done{background:var(--green-bg);color:var(--green-ink)}
.stg span.cur{background:var(--tint);color:#fff;font-weight:600}
.stg span.err{background:var(--red);color:#fff;font-weight:600}

/* ---------- 书的地图 ---------- */
.mapchk{display:flex;gap:12px;align-items:center;margin:0 16px 16px;background:var(--bg2);border-radius:20px;padding:12px 16px;font-size:15px}
.mapchk .grow{flex:1}
.mapchk small{display:block;font-size:13px;color:var(--label2)}
.mapchk small.warn{color:var(--orange-ink)}
.chap{margin:0 16px 10px;background:var(--bg2);border-radius:20px;overflow:hidden}
.chap .h{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.chap .h:active{background:var(--pressed)}
.chap .no{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font:700 15px var(--rounded);background:var(--fill2);color:var(--label2);flex:none}
.chap.done .no{background:var(--green-bg);color:var(--green-ink)}
.chap.cur .no{background:var(--tint);color:#fff}
.chap .h .grow{flex:1;min-width:0}
.chap .h .grow b{font-weight:600;font-size:16px;display:block}
.chap .h .grow small{display:block;font-size:13px;color:var(--label2)}
.chap .arr{color:var(--label3);transition:transform .35s var(--ease);width:16px;height:16px;stroke-width:2.6}
.chap.open .arr{transform:rotate(90deg)}
.kids{border-top:.5px solid var(--sep);padding:4px 0}
.kids.drop{animation:drop .45s var(--ease) both;transform-origin:top}
@keyframes drop{from{opacity:0;transform:translateY(-8px) scaleY(.96)}}
.sct{display:flex;align-items:center;gap:11px;min-height:44px;padding:8px 14px 8px 18px;width:100%;text-align:left;font-size:15px;position:relative}
.sct:active{background:var(--pressed)}
.sct.l3{padding-left:50px;font-size:15px}
.sct .grow{flex:1;min-width:0;line-height:1.35}
.sct .pg{font-size:13px;color:var(--label2);display:flex;align-items:center;gap:3px}
.sct .pg svg.i{width:13px;height:13px;stroke-width:2.6;transition:transform .3s var(--ease)}
.sct .pg svg.i.o{transform:rotate(90deg)}
.sct.cur{background:var(--tint-bg)}
.sct.cur .grow{color:var(--tint-ink);font-weight:600}
.sct.flag{background:var(--orange-bg)}
.sst{width:20px;height:20px;border-radius:50%;border:1.6px solid var(--label3);flex:none;display:grid;place-items:center;color:#fff}
.sst svg.i{width:12px;height:12px;stroke-width:3.2}
.sst.done{background:var(--green);border-color:var(--green)}
.sst.learning{border-color:var(--tint);background:conic-gradient(var(--tint) 0 50%,transparent 50% 100%)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:0;background:var(--bg2);border-radius:18px;overflow:hidden;margin-bottom:10px}
.kv span{padding:11px 16px;font-size:15px;border-top:.5px solid var(--sep)}
.kv span:nth-child(-n+2){border-top:0}
.kv span:nth-child(even){text-align:right;color:var(--label2)}
.srch{display:flex;align-items:center;gap:6px;height:40px;border-radius:12px;background:var(--fill);padding:0 10px;color:var(--label2);margin:0 2px 10px}
.srch input{flex:1;font-size:17px;color:var(--label)}
.srch svg.i{width:18px;height:18px}
.hit{background:var(--hl);border-radius:3px;padding:0 1px;color:var(--label)}

/* ---------- 听讲：进度、路线图胶囊、岔路条 ---------- */
.prog{display:flex;align-items:center;justify-content:space-between;padding:0 20px 6px;font-size:13px;color:var(--label2);height:24px}
.prog button{color:var(--tint);font-size:13px;font-weight:500;display:flex;align-items:center;gap:1px}
.prog button svg.i{width:13px;height:13px;stroke-width:2.6}
.rail{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{display:none}
.step{flex:none;display:flex;align-items:center;gap:7px;height:38px;padding:0 14px 0 5px;border-radius:19px;background:var(--bg2);font-size:14px;color:var(--label);scroll-snap-align:center;transition:transform .2s,background .3s;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.step:active{transform:scale(.96)}
.step .ic{width:28px;height:28px;border-radius:14px;display:grid;place-items:center;background:var(--fill);font:600 14px var(--rounded)}
.step .ic svg.i{width:15px;height:15px;stroke-width:2.6}
.step.done .ic{background:var(--tint);color:#fff}
.step.now{background:var(--tint);color:#fff;font-weight:600}
.step.now .ic{background:rgba(255,255,255,.24);color:#fff}
.step.skipped{color:var(--label2)}
.step.skipped .t{text-decoration:line-through;text-decoration-color:var(--label3)}
.banner{display:flex;align-items:center;gap:10px;margin:0 16px 10px;padding:8px 8px 8px 14px;border-radius:22px;background:var(--indigo-bg);color:var(--indigo);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.banner .grow{flex:1;min-width:0;font-size:15px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner small{display:block;font-size:11px;font-weight:500;opacity:.8}
.banner button{height:34px;padding:0 14px;border-radius:17px;background:var(--indigo);color:#fff;font-size:14px;font-weight:600;flex:none}

/* ---------- 听讲 thread ---------- */
.thread{padding:4px 20px 24px;display:flex;flex-direction:column;gap:12px}
.sys{align-self:center;font-size:12px;color:var(--label2);background:var(--fill2);border-radius:12px;padding:3px 10px;margin:4px 0;text-align:center}
.sys.dt{color:var(--indigo);background:var(--indigo-bg)}
.hist{align-self:center;font-size:13px;color:var(--label2);background:var(--bg2);border-radius:16px;padding:6px 14px;display:flex;align-items:center;gap:4px}
.hist svg.i{width:14px;height:14px;stroke-width:2.4;transition:transform .3s var(--ease)}
.hist.o svg.i{transform:rotate(180deg)}
.old{opacity:.62}
.head{display:flex;align-items:baseline;gap:8px;margin-top:14px;scroll-margin-top:12px}
.head .sn{font:600 13px var(--rounded);color:var(--tint);flex:none}
.head b{font-size:21px;font-weight:700;letter-spacing:-.01em;flex:1;line-height:1.3}
.head .pg{font-size:13px;color:var(--label2);flex:none}
.ai{font-size:var(--fz-ai);line-height:1.65;letter-spacing:-.005em}
.ai p{margin:0 0 10px}.ai p:last-child{margin-bottom:0}
.ai ul,.ai ol{padding-left:22px;margin:0 0 10px}
.ai li{margin:3px 0}
.ai b{font-weight:600}
.ai.dt{color:var(--label)}
.caret{display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--tint);margin-left:4px;vertical-align:1px;animation:blink 1s infinite}
.unv{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:10px;font-size:11px;font-weight:600;color:var(--label2);border:1px dashed var(--label3);vertical-align:2px;margin:0 2px}
.cite{display:inline-flex;align-items:center;height:21px;padding:0 8px;margin:0 2px;border-radius:11px;background:var(--tint-bg);color:var(--tint);font:600 12px var(--rounded);vertical-align:2px;cursor:pointer}
.cite:active{opacity:.6}
.cite.dt{background:var(--indigo-bg);color:var(--indigo)}
.user{align-self:flex-end;max-width:80%;background:var(--tint);color:#fff;padding:9px 15px;border-radius:21px;font-size:16px;line-height:1.5;white-space:pre-wrap}
.user.dt{background:var(--indigo)}
.user .q{display:block;font-size:13px;opacity:.85;border-left:2px solid rgba(255,255,255,.6);padding-left:7px;margin:2px 0 5px;white-space:normal}
.tool{display:flex;flex-direction:column;gap:3px}
.tool span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--label2)}
.tool span svg.i{width:16px;height:16px}
.tool span.run{animation:shim 1.2s infinite}
@keyframes shim{50%{opacity:.4}}
.tool.dt span svg.i{color:var(--indigo)}
.src{display:block;width:100%;text-align:left;background:var(--bg2);border-radius:20px;padding:13px 16px 14px;transition:transform .2s}
.src:active{transform:scale(.985)}
.lbl{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--label2);margin-bottom:5px}
.lbl svg.i{width:15px;height:15px}
.src .q{display:block;font:16px/1.75 var(--serif);color:var(--label)}
.aux{border-radius:20px;padding:12px 16px 13px;font-size:16px;line-height:1.62}
.aux .bd p{margin:0 0 8px}.aux .bd p:last-child{margin:0}
.derive{background:var(--purple-bg)}.derive .lbl{color:var(--purple)}
.ex{background:var(--teal-bg)}.ex .lbl{color:var(--teal)}
.card{background:var(--bg2);border-radius:20px;padding:13px 16px 14px;font-size:16px;line-height:1.6}
.card .lbl.acc{color:var(--tint)}
.card p{margin:0 0 6px}
.card .btns{margin-top:10px}
.check .lbl{color:var(--tint)}
.resume .lbl{color:var(--tint)}
.quiz .q{font-weight:600;margin-bottom:10px;font-size:16px;line-height:1.55}
.op{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--fill2);border-radius:16px;padding:11px 14px;margin-bottom:7px;font-size:15px;line-height:1.45;transition:background .25s,transform .2s}
.op:active{transform:scale(.985)}
.op .k{width:24px;height:24px;border-radius:12px;background:var(--bg2);display:grid;place-items:center;font:600 13px var(--rounded);flex:none;color:var(--label2)}
.op.right{background:var(--green-bg)}.op.right .k{background:var(--green);color:#fff}
.op.wrong{background:var(--red-bg)}.op.wrong .k{background:var(--red);color:#fff}
.op.muted{opacity:.5}
.prop{border:1.5px dashed color-mix(in srgb,var(--orange) 45%,transparent);background:var(--orange-bg)}
.prop .lbl{color:var(--orange-ink)}
.fold{background:var(--bg2);border-radius:20px;overflow:hidden}
.fold-h{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 14px;text-align:left;font-size:15px}
.fold-h>svg.i:first-child{width:22px;height:22px;padding:4px;border-radius:11px;background:var(--green);color:#fff;stroke-width:2.8}
.fold-h .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fold-h .cnt{font-size:13px;color:var(--label2)}
.fold-h>svg.i:last-child{color:var(--label3);transition:transform .3s var(--ease);width:16px;height:16px;stroke-width:2.6}
.fold.open .fold-h>svg.i:last-child{transform:rotate(90deg)}
.fold-b{display:flex;flex-direction:column;gap:10px;padding:12px 16px 16px;border-top:.5px solid var(--sep)}
.fold-b .ai{font-size:15px}.fold-b .user{font-size:15px}
.detour-run{display:flex;flex-direction:column;gap:12px;border-left:3px solid var(--indigo);padding-left:13px;margin-left:-16px}
.donecard .lbl{color:var(--green-ink)}
.typing{display:flex;gap:5px;padding:8px 2px}
.typing i{width:8px;height:8px;border-radius:4px;background:var(--label3);animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
.fig{margin:10px 0;border-radius:16px;background:var(--fill2);padding:10px 10px 8px;cursor:pointer}
.fig .cap,.cap{font:13px/1.6 var(--sf);color:var(--label2);margin-top:4px}
.figsvg{display:block;width:100%;height:auto;font:11px var(--sf)}
.figsvg .e path{stroke:var(--label3);stroke-width:1.5;fill:none}
.figsvg .e .dash{stroke-dasharray:4 3}.figsvg .e .on{stroke:var(--tint);stroke-width:2.6}.figsvg .e .bad{stroke:var(--red);stroke-dasharray:4 3}
.figsvg .n circle{fill:var(--bg2);stroke:var(--label2);stroke-width:1.2}
.figsvg .n .on{fill:var(--tint-bg);stroke:var(--tint)}.figsvg .n .goal{stroke:var(--green);stroke-width:2}
.figsvg text{fill:var(--label);text-anchor:middle}.figsvg .l text{font-weight:700;font-size:13px}
.figsvg .w text,.figsvg .s text{fill:var(--label2);font-size:10.5px}
.figsvg .lg text{text-anchor:start;font-size:10px}.figsvg .lg .a{fill:var(--tint)}.figsvg .lg .b{fill:var(--red)}

/* ---------- 听讲底部：快捷动作 + 输入框（悬浮毛玻璃，底部渐隐） ---------- */
#dock{position:absolute;left:0;right:0;bottom:0;padding:26px 0 30px;z-index:6;background:linear-gradient(to bottom,transparent,var(--bg) 46%);pointer-events:none}
#dock:empty{display:none}
#dock>*{pointer-events:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip,.composer,.qbar{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:var(--glass-sh),inset 0 0 0 .5px var(--glass-line)}
.chip{flex:none;height:40px;padding:0 16px;border-radius:20px;font-size:15px;font-weight:500;display:flex;align-items:center;gap:6px;transition:transform .2s;white-space:nowrap}
.chip:active{transform:scale(.95)}
.chip.pri{background:var(--tint);color:#fff;font-weight:600}
.chip.dt{background:var(--indigo);color:#fff;font-weight:600}
.chip svg.i{width:17px;height:17px;stroke-width:2.4}
.qbar{display:flex;align-items:center;gap:8px;margin:0 16px 8px;min-height:38px;padding:4px 4px 4px 14px;border-radius:19px;font-size:13px;color:var(--label2)}
.qbar b{color:var(--tint);font-weight:600;flex:none}
.qbar .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--serif)}
.qbar button{width:30px;height:30px;border-radius:15px;background:var(--fill);display:grid;place-items:center;flex:none}
.qbar button svg.i{width:13px;height:13px;stroke-width:2.8}
.composer{display:flex;align-items:center;gap:4px;margin:0 16px;height:52px;border-radius:26px;padding:0 6px 0 18px}
.composer input{flex:1;min-width:0;font-size:17px}
.composer input::placeholder{color:var(--label2)}
.mic{width:40px;height:40px;display:grid;place-items:center;color:var(--label2);border-radius:20px}
.send{width:40px;height:40px;border-radius:20px;background:var(--tint);color:#fff;display:grid;place-items:center;flex:none}
.send svg.i{stroke-width:2.6}
.send.stop svg.i{width:14px;height:14px;fill:currentColor;stroke:none}

/* ---------- 读书 ---------- */
.rdtool{display:flex;align-items:center;gap:12px;padding:0 16px 10px}
.rdtool .seg{width:140px;flex:none}
.rdtool .pgi{flex:1;min-width:0;text-align:right;font-size:12px;color:var(--label2);line-height:1.3}
.guide{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;width:calc(100% - 32px);margin:2px 16px 0;text-align:left;background:var(--bg2);border-radius:20px;padding:11px 14px}
.guide .lbl{margin:0;color:var(--tint)}
.guide .gt{flex:1;min-width:0;font-size:14px;color:var(--label2)}
.guide .gt.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.guide.open .gt{flex-basis:100%;order:3;color:var(--label);font-size:15px;line-height:1.6;margin-top:2px}
.guide>svg.i:last-child{color:var(--label3);transform:rotate(90deg);transition:transform .3s var(--ease);width:16px;height:16px;stroke-width:2.6}
.guide.open>svg.i:last-child{transform:rotate(-90deg)}
.pages{display:flex;flex-direction:column;gap:14px;padding:12px 16px 0}
.page{background:var(--page);border-radius:24px;padding:22px 20px 10px;font:var(--fz-book)/1.85 var(--serif);color:var(--label);position:relative;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.page.orig{font-size:12.5px;line-height:1.85;aspect-ratio:.72;padding:20px 22px 30px;overflow:hidden}
.page .run{font:10px var(--sf);color:var(--label3);display:flex;justify-content:space-between;margin-bottom:10px}
.page.orig .pno{position:absolute;bottom:10px;left:0;right:0;margin:0}

function bookStatus(b) {
  const st = S.study;
  if (b.id === 'aima') return '<span class="dot" style="color:var(--tint)"></span><span>在学 ' + esc(st.sec) + ' · 已学 ' + doneCount() + '/' + leafSecs().length + ' 个小节</span>';
  if (b.status === 'parsing') {
    const err = b.parts.find(x => x.err);
    const p = b.parts.find(x => x.stage < STAGES.length) || b.parts[b.parts.length - 1];
    const pct = Math.round(b.parts.reduce((a, x) => a + Math.min(x.stage, STAGES.length) * 20 + (x.stage < STAGES.length ? (x.pct || 0) / 5 : 0), 0) / b.parts.length);
    return err ? '<span class="dot" style="color:var(--red)"></span><span style="color:var(--red-ink)">解析暂停：Token 已过期</span>'
      : '<span class="dot" style="color:var(--orange)"></span><span>解析中 · ' + STAGES[Math.min(p.stage, 4)] + ' · <span class="n">' + pct + '%</span>' + (b.readyTo ? ' · p.1–' + b.readyTo + ' 可学' : '') + '</span>';
  }
  return '<span class="dot" style="color:var(--label3)"></span><span>' + (b.fmt === 'EPUB' ? 'EPUB · 本地解析 · ' : '') + '已就绪 · 未开始</span>';
}
function openBook(id) {
  const b = bookOf(id);
  if (b.status === 'parsing') return go('parse', { book: id });
  go('map', { book: id });
}
// 听讲的「‹」回到书的地图（03 §5）：从书架进来时把地图垫在下面

function openShelfSearch() {

function confirmUpload(i, o, parts) {
  const f = IMPORTABLE[i];
  if (!S.mineru.confirm) return doImport(i, o, parts);
  modal({ title: '上传到 MinerU？', body: '《' + esc(f.title) + '》（' + f.size + '，' + f.pages + ' 页）会上传到 MinerU 官方服务器解析，使用你在「我的 → 解析服务」里配置的 Token。', ok: '上传并解析', onOk: () => { setTimeout(() => doImport(i, o, parts), 320); } });
}
function doImport(i, o, parts) {
  const f = IMPORTABLE[i];
  if (S.books.some(b => b.src === i)) { showToast('这本书已经在书架上了'); return tab('shelf'); }
  const b = { id: 'imp' + i, src: i, title: f.title, author: f.author, fmt: f.fmt, pages: f.pages, size: f.size, color: f.color, chapters: f.chapters, model: o.model };
  S.books.push(b);
  if (f.fmt === 'EPUB') { b.status = 'ready'; showToast('已导入，地图已建好', 'ok'); R.stack = [{ name: 'shelf', p: {} }]; return go('map', { book: b.id }); }
  b.parts = parts.map(([from, to], k) => ({ from, to, stage: 0, pct: 0, speed: k ? 0.5 : 1 }));
  startParse(b);
  R.stack = [{ name: 'shelf', p: {} }];
  go('parse', { book: b.id });
}

let mapDrop = null;   // 刚展开的章 / 节：播一次弹性展开动画

SCREENS.map = {

  right: p => '<button class="nb" aria-label="全书搜索" onclick="' + on(() => openSearch(p.book)) + '">' + I('search') + '</button>',
  render(p) {

function openSec(id) {
  const s = S.sec[id];
  if (s.flag) return modal({ title: '确认 ' + id + ' 的标题', body: '这个标题在书里跨了两行，解析时被识别成「' + id + ' 满意搜索：不可容许的启发式函数与」和「加权A*搜索」两个标题。<br><br>已按 PDF 书签合并为一个小节：<b>' + esc(s.title) + '</b>（p.' + s.p0 + '–' + s.p1 + '）。', ok: '保持合并', cancel: '拆成两个', onOk: () => { s.flag = false; showToast('已确认', 'ok'); refresh(); }, onCancel: () => showToast('原型里不演示拆分') });

function openSearch(book) {
  if (book !== 'aima') return showToast('原型只有 AIMA 的示意内容可搜');
  sheet({ title: '全书搜索', sub: '在已解析的正文、标题和图注里搜索', body: '<label class="srch">' + I('search') + '<input id="sq" placeholder="一致代价、可容许、三角不等式" oninput="' + on(e => searchRun(e.target.value)) + '"></label><div id="sres"></div>' });
  setTimeout(() => $('#sq') && $('#sq').focus(), 300);
}
function searchRun(qs) {
  const k = qs.trim(), box = $('#sres'); if (!box) return;
  if (!k) { box.innerHTML = ''; return; }
  const hits = BLOCKS.filter(b => plain(b.x).toLowerCase().includes(k.toLowerCase())).slice(0, 8);
  box.innerHTML = hits.length ? '<div class="list">' + hits.map(b => {
    const x = plain(b.x), i = x.toLowerCase().indexOf(k.toLowerCase());

/* Pagewise 苹果风原型 · 听讲流程：按步讲解、快捷动作、小测、续学、岔路与折叠、自由提问（交互以 explore/src/app.js 为准） */
'use strict';
const REVIEW_342 = {
  title: '复习卡点：为什么扩展时才做目标测试',
  steps: ['读取卡点和上次的问答（3.4.2）', '读取 3.4.2 Dijkstra算法或一致代价搜索（p.90–93）'],
  answer: [
    '上次卡在：**为什么目标测试要放在扩展时，而不是生成时。**用书里这张图说明 [[b:b0903]]：',
    '{{fig:f310}}',
    '1. 扩展 S，生成 A（g=1）和 B（g=3）。\n2. 扩展代价最小的 A，生成 G，此时 g(G)=11。\n3. 如果**生成时**就测试，这里就返回了代价 11 的路。\n4. 但边界里还有 B（g=3）。继续扩展 B，会发现经 B 到 G 只要 4。',

  ].join('\n\n'),

};

const ST = () => S.study;

// AI 回答：先出「正在输入」，再逐项出现；讲解、推导、举例逐字流式
async function say(items) {
  const st = ST(), tgt = target();

// ---------- 岔路：进行中左侧靛蓝竖线，回到主线后折叠成「已解决」 ----------
function openDetour(sec, title, reviewing) {

// 快捷动作规则（03 §5.3）：第一个是主操作
function quickActions(st) {

function readerMarks(sec) {

'use strict';

  cards: [
    { f: 'A* 的评价函数是什么？各项含义？', b: 'f(n) = g(n) + h(n)：g 是从起点到 n 的已走代价，h 是从 n 到目标的估计代价。' },
    { f: '什么是可容许的启发式函数？', b: '从不高估到达目标的真实代价（乐观）。h 可容许时，A* 代价最优。' },
    { f: '一致性的定义？和可容许的关系？', b: 'h(n) ≤ c(n, a, n′) + h(n′)。一致 ⇒ 可容许，反之不一定。' },
    { f: 'h(n) ≡ 0 时 A* 变成什么？', b: '一致代价搜索（Dijkstra 算法）。', detour: true },
    { f: '最优高效（optimally efficient）指什么？', b: '在同一启发式、保证最优的算法中，A* 扩展的结点数几乎最少。' }
  ]
};

SCREENS.done = {
  title: '本节小结', short: '小结',
  render(p) {
    const st = ST();
    if (!p.d) {
      const dt = st.detourLog.length > 0;
      p.d = { summary: DRAFT.summary, cards: DRAFT.cards.filter(c => !c.detour || dt).map(c => Object.assign({ on: true }, c)),
        stuck: st.stuckCand.filter(x => !S.stuck.some(y => y.x === x && !y.ok)).map(x => ({ x, on: true })) };

function setTheme(k) {
  S.theme = k;
  const dark = k === 'dark' || (k === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
}
function setFont(k) {
  S.fontSize = k;
  const r = document.documentElement.style;
  r.setProperty('--fz-ai', { 小: '15px', 中: '17px', 大: '19px' }[k]);
  r.setProperty('--fz-book', { 小: '15px', 中: '17px', 大: '19.5px' }[k]);
}

/* Pagewise 苹果风原型 · 原型控制台（右侧）、启动 */
'use strict';
const PAGES = [['shelf', '书架'], ['map', '书的地图', { book: 'aima' }], ['study', '听讲'], ['read', '读书'], ['reader', '读书·其他小节', { sec: '3.4.2' }], ['done', '本节小结'],
  ['importSet', '解析设置', { i: 1 }], ['parse', '解析进度', { book: 'slm' }], ['review', '复习'], ['rv', '复习闪卡'], ['notes', '笔记'], ['notesBook', '笔记·按节'], ['noteDetail', '笔记·3.4.2', { sec: '3.4.2' }],
  ['me', '我的'], ['meMineru', '解析服务'], ['meAI', 'AI 服务'], ['mePrefs', '讲解偏好'], ['meAppearance', '外观'], ['meStorage', '存储与备份']];
function openPage(name, p) {
  const roots = ['shelf', 'review', 'notes', 'me'];
  if (roots.includes(name)) return tab(name);
  if (name === 'study' || name === 'read') { S.study.mode = name === 'read' ? 'read' : 'listen'; R.stack = [{ name: 'shelf', p: {} }, { name: 'map', p: { book: 'aima' } }]; return go('study'); }
  R.stack = [{ name: name.startsWith('me') ? 'me' : name === 'rv' ? 'review' : name.startsWith('note') ? 'notes' : 'shelf', p: {} }];
  if (name === 'done') R.stack.push({ name: 'map', p: { book: 'aima' } }, { name: 'study', p: {} });
  go(name, p ? clone(p) : {});
}
const SCEN = [
  ['续学', '隔 3 天打开，先回顾卡点', () => { resetStudy(); S.daysAway = 3; openPage('study'); }],
  ['岔路', '讲 A* 时问一致代价搜索', () => { resetStudy(1); openPage('study'); setTimeout(() => { $('#cin').value = '这跟前面的一致代价搜索有什么关系？'; sendText(); }, 300); }],
  ['点引用', '原文预览浮层', () => { resetStudy(1); openPage('study'); setTimeout(() => peek('b1025'), 350); }],
  ['路线图', '点第 4 步，从这里开始讲', () => { resetStudy(1); openPage('study'); setTimeout(() => tapStep(3), 350); }],
  ['小测', '讲完最后一步，做本节小测', () => { resetStudy(3, { quiz: true }); openPage('study'); }],
  ['读书模式', '讲过的段落、便签、导读', () => { resetStudy(2); S.readerMode = 'flow'; openPage('read'); }],
  ['段落菜单', '点一段：解释、从这里开始讲', () => { resetStudy(2); S.readerMode = 'flow'; openPage('read'); setTimeout(() => { flashBlock('b1026'); setTimeout(() => { const el = $('#b1026'); if (el) el.click(); }, 120); }, 400); }],
  ['学完一节', '摘要、卡点、闪卡草稿', () => { resetStudy(3, { ready: true }); openPage('done'); }],
  ['导入新书', '扫描版 744 页，分 4 片', () => { tab('shelf'); openImport(); }],
  ['解析失败', 'Token 过期，解析暂停', () => { S.sim.tokenExpired = true; tab('shelf'); go('importSet', { i: 0 }); showToast('已模拟 Token 过期，点「开始解析」看看'); }],
  ['复习闪卡', '点卡片 3D 翻面', () => openPage('rv')],
  ['导出笔记', 'Markdown / Anki', () => { openPage('notesBook'); setTimeout(openExport, 100); }]
];
function renderConsole() {
  const c = cur(), pg = c.name === 'study' && S.study.mode === 'read' ? 'read' : c.name;
  $('#console').innerHTML = '<h1>苹果风</h1><div class="lead">Pagewise 第二皮肤 glass 的完整原型：页面、导航、文案和操作位置与 <a href="prototype.html">纸感原型</a> 一致，组件按 iOS（Liquid Glass）习惯重做。听讲 / 读书用 explore 里的新交互。</div>' +
    '<div class="tg">' + [['system', '跟随系统'], ['light', '浅色'], ['dark', '深色']].map(([k, l]) => '<button class="' + (S.theme === k ? 'on' : '') + '" onclick="setTheme(\'' + k + '\');refresh()">' + l + '</button>').join('') + '</div>' +
    '<h2>场景</h2><div class="jump">' + SCEN.map(([t, d], i) => '<button onclick="SCEN[' + i + '][2]()">' + t + '<small>' + d + '</small></button>').join('') + '</div>' +
    '<h2>页面</h2><div class="pgs">' + PAGES.map(([k, l], i) => '<button class="' + (pg === k ? 'on' : '') + '" onclick="openPage(PAGES[' + i + '][0], PAGES[' + i + '][2])">' + l + '</button>').join('') + '</div>' +
    '<h2>试试这些</h2><p>· 听讲里输入「这跟前面的一致代价搜索有什么关系？」进入岔路，再点「回到主线」看折叠。</p><p>· 点讲解里的 <b>p.103</b> 弹出原书预览；浮层可以按住顶部下滑关闭。</p><p>· 顶栏右侧「读书 | 听讲」切换，位置不丢；读书里点段落 →「从这里开始讲」。</p><p>· 书架、复习、笔记、我的往下滚，大标题收进顶栏。</p>' +
    '<h2>说明</h2><p>书名和章节目录来自《人工智能：现代方法（第4版）》；页码、原文、讲解和闪卡都是示意内容。AI 回答是预先写好的脚本。依据：docs/dev/02-skins.md §2、§5、§7。</p>' +
    '<button class="rst" onclick="reset();setTheme(S.theme);setFont(S.fontSize);tab(\'shelf\')">重置原型</button>';
}

// ---------- 启动 ----------
reset();
startParse(bookOf('slm'));
setTheme('system');
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.theme === 'system') setTheme('system'); });
$('#view').addEventListener('scroll', onScroll, { passive: true });
(function boot() {
  const want = decodeURIComponent(location.hash.slice(1));
  const pg = PAGES.find(x => x[1] === want || x[0] === want);
  if (pg) openPage(pg[0], pg[2]); else render(true);
})();
