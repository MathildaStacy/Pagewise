<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagewise · 苹果风探索</title>
<style>
:root{
  --bg:#F2F2F7;--bg2:#FFFFFF;--fill:rgba(120,120,128,.14);--fill2:rgba(120,120,128,.08);
  --label:#000;--label2:rgba(60,60,67,.62);--label3:rgba(60,60,67,.32);--sep:rgba(60,60,67,.16);
  --tint:#007AFF;--tint-bg:rgba(0,122,255,.11);--indigo:#5856D6;--indigo-bg:rgba(88,86,214,.11);
  --purple:#AF52DE;--purple-bg:rgba(175,82,222,.09);--teal:#0A9CB5;--teal-bg:rgba(48,176,199,.11);
  --orange:#E07A00;--green:#34C759;--hl:rgba(255,204,0,.32);
  --glass:rgba(255,255,255,.66);--glass-hi:rgba(255,255,255,.9);--glass-line:rgba(255,255,255,.75);--glass-sh:0 8px 28px rgba(0,0,0,.10),0 1px 3px rgba(0,0,0,.06);
  --page:#FFFFFF;--thumb:#FFFFFF;--scrim:rgba(0,0,0,.22);
  --sf:-apple-system,"SF Pro Text","SF Pro Display","PingFang SC","Helvetica Neue",system-ui,sans-serif;
  --serif:"Songti SC","Noto Serif SC","STSong",ui-serif,serif;
  --rounded:ui-rounded,"SF Pro Rounded",-apple-system,"PingFang SC",sans-serif;
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#000;--bg2:#1C1C1E;--fill:rgba(120,120,128,.28);--fill2:rgba(120,120,128,.18);
  --label:#fff;--label2:rgba(235,235,245,.62);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.55);
  --tint:#0A84FF;--tint-bg:rgba(10,132,255,.2);--indigo:#7D7AFF;--indigo-bg:rgba(94,92,230,.22);
  --purple:#DA8FFF;--purple-bg:rgba(191,90,242,.16);--teal:#5DE0F5;--teal-bg:rgba(64,200,224,.14);
  --orange:#FF9F0A;--green:#30D158;--hl:rgba(255,214,10,.26);
  --glass:rgba(40,40,44,.62);--glass-hi:rgba(44,44,48,.92);--glass-line:rgba(255,255,255,.12);--glass-sh:0 8px 28px rgba(0,0,0,.5);
  --page:#1C1C1E;--thumb:#636366;--scrim:rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sf);background:#E4E4EA;color:var(--label);-webkit-font-smoothing:antialiased;transition:background .3s}
[data-theme=dark] body{background:#111114}
button,input{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{cursor:text;outline:0}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px;border-radius:10px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.stage{min-height:100%;display:flex;gap:40px;justify-content:center;align-items:center;padding:28px 16px}
.phone{width:390px;height:844px;flex:none;position:relative;overflow:hidden;border-radius:56px;background:var(--bg);display:flex;flex-direction:column;
  box-shadow:0 0 0 11px #1A1A1C,0 0 0 13px #3A3A3E,0 30px 80px rgba(0,0,0,.35);transition:background .3s}
.sbar{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 40px;font:600 17px var(--sf);position:relative}
.sbar .island{position:absolute;left:50%;top:11px;width:124px;height:36px;border-radius:20px;background:#000;transform:translateX(-50%)}
.sbar .r{display:flex;gap:6px;align-items:center}
.sbar .r svg{height:12px;width:auto;fill:currentColor}

#appbar{height:46px;flex:none;display:grid;grid-template-columns:96px 1fr 96px;align-items:center;padding:0 8px}
#appbar .ib{height:44px;min-width:44px;display:flex;align-items:center;gap:2px;color:var(--tint);font-size:17px}
#appbar .ib:last-child{justify-self:end;justify-content:center}
#appbar .ib svg.i{width:24px;height:24px}
#appbar .ib.back svg.i{width:24px;height:24px;stroke-width:2.4}
.ttl{text-align:center;line-height:1.2;min-width:0}
.ttl b{display:block;font-size:17px;font-weight:600;white-space:nowrap}
.ttl small{font-size:11px;color:var(--label2);white-space:nowrap}

#modebar{flex:none;padding:6px 16px 10px}
.seg{position:relative;display:flex;height:36px;border-radius:18px;background:var(--fill);padding:2px}
.seg .thumb{position:absolute;top:2px;bottom:2px;width:calc(50% - 2px);border-radius:16px;background:var(--thumb);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);transition:left .38s cubic-bezier(.32,.72,0,1)}
.seg .thumb.read{left:2px}.seg .thumb.listen{left:50%}
.seg button{flex:1;position:relative;font-size:15px;font-weight:500;color:var(--label);border-radius:16px}
.seg button.on{font-weight:600}

#top{flex:none}
.rail{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{display:none}
.step{flex:none;display:flex;align-items:center;gap:7px;height:38px;padding:0 14px 0 5px;border-radius:19px;background:var(--bg2);font-size:14px;color:var(--label);scroll-snap-align:center;transition:transform .2s,background .3s}
.step:active{transform:scale(.96)}
.step .ic{width:28px;height:28px;border-radius:14px;display:grid;place-items:center;background:var(--fill);font:600 14px var(--rounded)}
.step .ic svg.i{width:15px;height:15px;stroke-width:2.6}
.step.done .ic{background:var(--tint);color:#fff}
.step.now{background:var(--tint);color:#fff;font-weight:600}
.step.now .ic{background:rgba(255,255,255,.24);color:#fff}
.step.skipped{color:var(--label2)}
.step.skipped .t{text-decoration:line-through;text-decoration-color:var(--label3)}
.banner{display:flex;align-items:center;gap:10px;margin:0 16px 10px;padding:8px 8px 8px 14px;border-radius:22px;background:var(--indigo-bg);color:var(--indigo)}
.banner .grow{flex:1;font-size:15px;font-weight:600;line-height:1.25}
.banner small{display:block;font-size:11px;font-weight:500;opacity:.8}
.banner button{height:34px;padding:0 14px;border-radius:17px;background:var(--indigo);color:#fff;font-size:14px;font-weight:600}

#view{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
[data-mode=listen] #view{padding-bottom:150px}
.thread{padding:2px 20px 24px;display:flex;flex-direction:column;gap:12px}
.enter{animation:rise .42s cubic-bezier(.32,.72,0,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.sys{align-self:center;font-size:12px;color:var(--label2);background:var(--fill2);border-radius:12px;padding:3px 10px;margin:4px 0}
.head{display:flex;align-items:baseline;gap:8px;margin-top:14px;scroll-margin-top:8px}
.head .sn{font:600 13px var(--rounded);color:var(--tint)}
.head b{font-size:21px;font-weight:700;letter-spacing:-.01em;flex:1}
.head .pg{font-size:13px;color:var(--label2)}
.ai{font-size:17px;line-height:1.65;letter-spacing:-.005em}
.ai b{font-weight:600}
.math{font-family:"Times New Roman",ui-serif,serif;font-style:italic;font-size:1.05em;white-space:nowrap}
.user{align-self:flex-end;max-width:80%;background:var(--tint);color:#fff;padding:9px 15px;border-radius:21px;font-size:16px;line-height:1.5}
.tool{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--label2)}
.tool svg.i{width:16px;height:16px}
.src{display:block;width:100%;text-align:left;background:var(--bg2);border-radius:20px;padding:13px 16px 14px;transition:transform .2s}
.src:active{transform:scale(.985)}
.lbl{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--label2);margin-bottom:5px}
.lbl svg.i{width:15px;height:15px}
.src .q{display:block;font:16px/1.75 var(--serif);color:var(--label)}
.aux{border-radius:20px;padding:12px 16px 13px;font-size:16px;line-height:1.62}
.derive{background:var(--purple-bg)}.derive .lbl{color:var(--purple)}
.ex{background:var(--teal-bg)}.ex .lbl{color:var(--teal)}
.check,.resume{background:var(--bg2);border-radius:20px;padding:12px 16px;font-size:16px;line-height:1.6}
.check .lbl{color:var(--tint)}
.cite{display:inline-flex;align-items:center;height:21px;padding:0 8px;margin:0 2px;border-radius:11px;background:var(--tint-bg);color:var(--tint);font:600 12px var(--rounded);vertical-align:2px}
.cite.dt{background:var(--indigo-bg);color:var(--indigo)}
.fold{background:var(--bg2);border-radius:20px;overflow:hidden}
.fold-h{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 14px;text-align:left;font-size:15px}
.fold-h>svg.i:first-child{width:22px;height:22px;padding:4px;border-radius:11px;background:var(--green);color:#fff;stroke-width:2.8}
.fold-h .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fold-h .n{font-size:13px;color:var(--label2)}
.fold-h>svg.i:last-child{color:var(--label3);transition:transform .3s}
.fold.open .fold-h>svg.i:last-child{transform:rotate(90deg)}
.fold-b{display:flex;flex-direction:column;gap:10px;padding:2px 16px 16px;border-top:.5px solid var(--sep);padding-top:12px}
.fold-b .ai{font-size:15px}.fold-b .user{font-size:15px;background:var(--indigo)}
.detour-run{display:flex;flex-direction:column;gap:12px;border-left:3px solid var(--indigo);padding-left:13px;margin-left:-16px}
.detour-run .user{background:var(--indigo)}
.donecard{background:var(--bg2);border-radius:20px;padding:14px 16px;font-size:15px;line-height:1.6}
.donecard .lbl{color:var(--green)}
.typing{display:flex;gap:5px;padding:8px 2px}
.typing i{width:8px;height:8px;border-radius:4px;background:var(--label3);animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}

/* 底部：浮在内容上的玻璃 */
#dock{position:absolute;left:0;right:0;bottom:0;padding:26px 0 30px;z-index:5;background:linear-gradient(to bottom,transparent,var(--bg) 46%);pointer-events:none}
[data-mode=read] #dock{display:none}
#dock>*{pointer-events:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip,.composer{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:var(--glass-sh),inset 0 0 0 .5px var(--glass-line)}
.chip{flex:none;height:40px;padding:0 16px;border-radius:20px;font-size:15px;font-weight:500;display:flex;align-items:center;gap:6px;transition:transform .2s}
.chip:active{transform:scale(.95)}
.chip.pri{background:var(--tint);color:#fff;font-weight:600}
.chip svg.i{width:17px;height:17px;stroke-width:2.4}
.composer{display:flex;align-items:center;gap:4px;margin:0 16px;height:52px;border-radius:26px;padding:0 6px 0 18px}
.composer input{flex:1;min-width:0;font-size:17px}
.composer input::placeholder{color:var(--label2)}
.mic{width:40px;height:40px;display:grid;place-items:center;color:var(--label2)}
.send{width:40px;height:40px;border-radius:20px;background:var(--tint);color:#fff;display:grid;place-items:center}
.send svg.i{stroke-width:2.6}

/* 读书 */
.guide{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;width:calc(100% - 32px);margin:0 16px;text-align:left;background:var(--bg2);border-radius:20px;padding:11px 14px}
.guide .lbl{margin:0;color:var(--tint)}
.guide .gt{flex:1;min-width:0;font-size:14px;color:var(--label2)}
.guide .gt.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.guide.open .gt{flex-basis:100%;order:3;color:var(--label);font-size:15px;line-height:1.6;margin-top:2px}
.guide>svg.i:last-child{color:var(--label3);transform:rotate(90deg);transition:transform .3s}
.guide.open>svg.i:last-child{transform:rotate(-90deg)}
.page{margin:12px 16px 0;background:var(--page);border-radius:24px;padding:22px 20px 8px;font:17px/1.85 var(--serif);color:var(--label)}
.blk{position:relative;margin:0 -10px 8px;padding:3px 10px;border-radius:12px;cursor:pointer;transition:background .25s}
.blk::before{content:"";position:absolute;left:-3px;top:8px;bottom:8px;width:3px;border-radius:2px;background:transparent}
.blk.heard::before{background:color-mix(in srgb,var(--tint) 35%,transparent)}
.blk.now::before{background:var(--tint)}
.blk.hl{background:var(--hl)}
.blk.sel{background:var(--tint-bg)}
.blk.flash{animation:flash 2s ease-out}
@keyframes flash{0%,30%{background:var(--tint-bg);box-shadow:0 0 0 3px color-mix(in srgb,var(--tint) 40%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
.b-h{font:700 22px/1.4 var(--sf);letter-spacing:-.01em;margin-bottom:12px}
.b-eq{text-align:center;font-size:19px}
.b-fig .cap,.cap{font:13px/1.6 var(--sf);color:var(--label2);margin-top:4px}
.figsvg{display:block;width:100%;height:auto;font:11px var(--sf)}
.figsvg .e path{stroke:var(--label3);stroke-width:1.5;fill:none}
.figsvg .e .dash{stroke-dasharray:4 3}.figsvg .e .on{stroke:var(--tint);stroke-width:2.6}
.figsvg .n circle{fill:var(--bg2);stroke:var(--label2);stroke-width:1.2}
.figsvg .n .on{fill:var(--tint-bg);stroke:var(--tint)}.figsvg .n .goal{stroke:var(--green);stroke-width:2}
.figsvg text{fill:var(--label);text-anchor:middle}.figsvg .l text{font-weight:700;font-size:13px}
.figsvg .w text,.figsvg .s text{fill:var(--label2);font-size:10.5px}
.pin{display:flex;align-items:center;gap:6px;margin:-2px 0 12px;padding:7px 12px;border-radius:16px;background:rgba(255,204,0,.2);color:#8A5A00;font:500 13px var(--sf);text-align:left}
[data-theme=dark] .pin{color:#FFD60A;background:rgba(255,214,10,.14)}
.pin svg.i{width:16px;height:16px}
.pno{text-align:center;font:12px var(--rounded);color:var(--label3);margin:4px 0 14px}
.readend{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 16px 48px}
.readend small{font-size:12px;color:var(--label2)}

/* 按钮与浮层 */
.btn{height:50px;padding:0 22px;border-radius:25px;background:var(--fill);color:var(--tint);font-size:17px;font-weight:600;transition:transform .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--tint);color:#fff}
#overlay{position:absolute;inset:0;z-index:20;pointer-events:none}
#overlay:empty{display:none}
#overlay.show{pointer-events:auto}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .3s}
#overlay.show .scrim{opacity:1}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;max-height:78%;display:flex;flex-direction:column;border-radius:40px;background:var(--glass-hi);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:0 20px 60px rgba(0,0,0,.25),inset 0 0 0 .5px var(--glass-line);
  transform:translateY(110%);transition:transform .46s cubic-bezier(.32,.72,0,1)}
#overlay.show .sheet{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:7px auto 0;flex:none}
.sh{text-align:center;padding:10px 24px 8px;flex:none}
.sh b{font-size:17px;font-weight:600}
.sh small{display:block;font-size:12px;color:var(--label2);margin-top:2px}
.sb{overflow-y:auto;padding:4px 18px 4px;min-height:0}
.sp{font-size:16px;line-height:1.6;margin:4px 2px 10px}
.sp.quote{font-family:var(--serif);color:var(--label)}
.sp.stuck{display:flex;gap:8px;align-items:flex-start;color:var(--orange);font-size:15px}
.sub{font-size:13px;color:var(--label2);font-weight:600;margin:10px 4px 6px}
.sf{display:flex;flex-direction:column;gap:8px;padding:12px 16px 18px;flex:none}
.peek{background:var(--page);border-radius:22px;padding:16px 16px 8px;font:15px/1.8 var(--serif);max-height:330px;overflow-y:auto}
.pblk{padding:2px 8px;margin:0 -8px 6px;border-radius:10px}
.pblk.tgt{background:var(--hl);box-shadow:0 0 0 2px color-mix(in srgb,var(--tint) 45%,transparent)}
.pblk.b-eq{text-align:center}
.ck{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg2);border-radius:18px;padding:11px 14px;margin-bottom:8px}
.ck .bx{width:24px;height:24px;border-radius:12px;border:1.5px solid var(--label3);display:grid;place-items:center;color:transparent;flex:none;transition:all .2s}
.ck .bx svg.i{width:14px;height:14px;stroke-width:3}
.ck.on .bx{background:var(--tint);border-color:var(--tint);color:#fff}
.ck .grow{flex:1;min-width:0;font-size:15px;line-height:1.4}
.ck small{display:block;color:var(--label2);font-size:13px;margin-top:2px}
#toast{position:absolute;left:50%;top:60px;z-index:30;transform:translate(-50%,-14px);opacity:0;pointer-events:none;max-width:330px;padding:10px 18px;border-radius:22px;font-size:14px;font-weight:500;text-align:center;background:var(--glass-hi);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:var(--glass-sh),inset 0 0 0 .5px var(--glass-line);transition:all .35s cubic-bezier(.32,.72,0,1)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.homebar{position:absolute;left:50%;bottom:8px;width:136px;height:5px;border-radius:3px;background:var(--label);transform:translateX(-50%);z-index:40;opacity:.85}

/* 说明 */
.side{width:300px;flex:none;font-size:14px;line-height:1.6;color:var(--label)}
.side h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
.side .lead{color:var(--label2);margin:4px 0 18px}
.side .tg{display:inline-flex;background:var(--fill);border-radius:18px;padding:2px;margin-bottom:20px}
.side .tg button{height:32px;padding:0 16px;border-radius:16px;font-size:14px;font-weight:500}
.side .tg button.on{background:var(--thumb);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.side h2{font-size:13px;color:var(--label2);font-weight:600;margin-bottom:6px}
.side ol{padding-left:18px;margin-bottom:18px}
.side li{margin:4px 0}
.side a{color:var(--tint);text-decoration:none}
@media (max-width:780px){.stage{flex-direction:column}.side{width:390px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <div class="sbar"><span>21:40</span><span class="island"></span><span class="r"><svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg viewBox="0 0 27 12"><rect x=".5" y=".5" width="23" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="16" height="8" rx="2"/><rect x="24.5" y="4" width="2" height="4" rx="1" opacity=".4"/></svg></span></div>
    <header id="appbar"></header>
    <div id="modebar"></div>
    <div id="top"></div>
    <main id="view"></main>
    <div id="dock"></div>
    <div id="overlay"></div>
    <div id="toast" role="status"></div>
    <div class="homebar"></div>
  </div>
  <aside class="side">
    <h1>苹果风</h1>
    <p class="lead">iOS 26 Liquid Glass：圆角、毛玻璃浮层、系统蓝。只做了「听讲」和「读书」两个页面。</p>
    <div class="tg"><button data-t="light" onclick="setTheme('light')">浅色</button><button data-t="dark" onclick="setTheme('dark')">深色</button></div>
    <h2>可以试试</h2>
    <ol>
      <li>点讲解里的 <b>p.103</b>：从底部弹出原书预览，再点「在读书模式打开」</li>
      <li>点「懂了，下一步」「这步熟，跳过」，看顶部路线图</li>
      <li>输入"这跟前面的 3.4.2 有什么关系"，进入岔路，再点「回到主线」看折叠</li>
      <li>切到「读书」：点段落 → 「从这里开始讲」；点黄色便签</li>
      <li>讲完第 4 步 → 「懂了，下一节」看闪卡草稿</li>
    </ol>
    <h2>对比</h2>

    if (b.p !== lastP) { if (lastP) h += '<div class="pno">p.' + lastP + '</div>'; lastP = b.p; }
    const cls = ['blk', 'b-' + b.t, b.s <= doneTo ? 'heard' : '', b.s === S.cur && !S.finished ? 'now' : '', S.hl.has(b.id) ? 'hl' : ''].join(' ');
    h += '<div class="' + cls + '" id="' + b.id + '" onclick="' + on(() => blockMenu(b.id)) + '">' + (b.t === 'fig' ? FIG + '<div class="cap">' + esc(b.x) + '</div>' : blockText(b)) + '</div>';
    const pin = S.pins[b.id];
    if (pin) h += '<button class="pin" onclick="' + on(() => openPin(b.id)) + '">' + I('pin') + '<span>已解决：' + esc(pin.q) + '</span></button>';
  });
  h += '<div class="pno">p.' + lastP + '</div></article>';
  h += '<div class="readend"><button class="btn pri" onclick="' + on(finish) + '">读完这一节</button><small>和听讲一样生成摘要和闪卡草稿</small></div>';
  return h;
}

// ---------- 渲染 ----------
function render() {
  $('#appbar').innerHTML = '<button class="ib back" aria-label="返回书的地图" onclick="' + on(typeof goBack === 'function' ? goBack : () => toast('返回书的地图')) + '">' + I('back') + (THEME === 'apple' ? '<span>地图</span>' : '') + '</button><div class="ttl"><b>3.5.2 A* 搜索</b><small>人工智能：现代方法 · p.102–106</small></div><button class="ib" aria-label="更多" onclick="' + on(() => toast('更多：AI 看到的内容、讲解偏好')) + '">' + I('more') + '</button>';
  $('#modebar').innerHTML = '<div class="seg" role="tablist"><span class="thumb ' + S.mode + '"></span>' + [['read', '读书', 'bookopen'], ['listen', '听讲', 'teach']].map(([k, l, ic]) => '<button role="tab" aria-selected="' + (S.mode === k) + '" class="' + (S.mode === k ? 'on' : '') + '" onclick="' + on(() => setMode(k)) + '">' + (THEME === 'google' && S.mode === k ? I('check') : '') + l + '</button>').join('') + '</div>';
  $('#phone').dataset.mode = S.mode;
  renderView(true);
}
function renderView(toEnd) {
  const v = $('#view'), top = v.scrollTop;
  $('#top').innerHTML = S.mode === 'listen' ? listenTop() : '';
  $('#dock').innerHTML = S.mode === 'listen' ? listenDock() : '';
  v.innerHTML = S.mode === 'listen' ? '<div class="thread">' + S.msgs.map(item).join('') + '</div>' : readerView();
  if (S.mode === 'listen' && toEnd) v.scrollTop = v.scrollHeight; else v.scrollTop = top;
  const cur = $('.rail .step.now'); if (cur) cur.parentNode.scrollLeft = Math.max(0, cur.offsetLeft - 60);
}
function scrollEnd() { const v = $('#view'); v.scrollTo({ top: v.scrollHeight, behavior: REDUCED ? 'auto' : 'smooth' }); }

// ---------- 讲解推进 ----------
async function say(items, opts) {
  S.busy = true;
  const tgt = S.detour ? S.detour.items : S.msgs;
  tgt.push({ k: 'typing' }); renderView(true);
  await sleep(650); tgt.pop();
  for (const it of items) { tgt.push(it); renderView(false); const el = $('#view .thread').lastElementChild; if (el) el.classList.add('enter'); scrollEnd(); await sleep(260); }
  S.busy = false; renderView(false); scrollEnd();
}
async function next() {
  if (S.busy) return;
  S.st[S.cur] = 'done';
  if (S.cur === 3) { S.msgs.push({ k: 'done' }); renderView(true); return; }
  S.cur++; S.st[S.cur] = 'now';
  S.msgs.push({ k: 'head', i: S.cur });
  await say(LESSON[S.cur]);
}
async function skip() {
  if (S.busy || S.cur === 3) return toast(S.cur === 3 ? '最后一步不能跳过' : '');
  S.st[S.cur] = 'skipped';
  S.msgs.push({ k: 'sys', t: SKIP_NOTE[S.cur] || '跳过了第 ' + (S.cur + 1) + ' 步' });
  S.cur++; S.st[S.cur] = 'now';
  S.msgs.push({ k: 'head', i: S.cur });
  await say(LESSON[S.cur]);
}
async function alt(kind, label) {
  if (S.busy) return;
  S.msgs.push({ k: 'user', t: label });
  await say([{ k: kind === 'ex' ? 'ex' : kind === 'dv' ? 'derive' : 'ai', t: ALT[S.cur][kind] }]);
}
async function ask(text) {
  if (S.busy) return;
  if (!S.detour && /3\.4|一致代价|前面|Dijkstra/i.test(text)) {
    S.detour = { sec: '3.4.2 一致代价搜索', items: [{ k: 'user', t: text }] };
    S.msgs.push({ k: 'detour', items: S.detour.items });
    render();
    await say([{ k: 'tool', t: '读取 3.4.2 一致代价搜索（p.90–93）' }, { k: 'ai', t: '一致代价搜索按 $g(n)$ 扩展 [[d1]]；A* 按 $g(n) + h(n)$ 扩展。h 恒为 0 时两者完全一样。所以 A* 可以看成"带方向感的一致代价搜索" [[b2]]。' }]);
    return;
  }
  (S.detour ? S.detour.items : S.msgs).push({ k: 'user', t: text });
  if (S.detour) return say([{ k: 'ai', t: '不一定更快，但 h 越准，A* 扩展的结点越少；h 可容许时两者找到的都是最优解 [[b11]]。' }]);
  await say([{ k: 'ai', t: '按书里的说法：' + ALT[S.cur].re.replace(/^换个说法：/, '') }]);
}
function backToMain() {
  const d = S.detour; if (!d) return;
  const i = S.msgs.findIndex(m => m.k === 'detour');
  S.msgs[i] = { k: 'fold', open: false, title: 'A* 和一致代价搜索的关系', items: d.items };
  S.detour = null;
  S.msgs.push({ k: 'sys', t: '回到主线 · 第 ' + (S.cur + 1) + ' 步 ' + STEPS[S.cur].t });
  render(); toast('岔路已折叠，问答记进了 3.4.2 的笔记');
}
function tapStep(i) {
  if (S.busy) return;
  const el = $('#step-' + i);
  if (el) return el.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' });
  sheet('从第 ' + (i + 1) + ' 步开始讲？', '<p class="sp">「' + esc(STEPS[i].t) + '」· p.' + STEPS[i].p + '。中间没讲的步骤会留着，随时可以回来讲。</p>', [['开始讲', () => jumpTo(i), 'pri'], ['取消', closeSheet]]);
}
async function jumpTo(i) {
  closeSheet();
  if (S.st[S.cur] === 'now') S.st[S.cur] = 'todo';
  S.cur = i; S.st[i] = 'now';
  S.msgs.push({ k: 'head', i });
  if (S.mode !== 'listen') { S.mode = 'listen'; render(); }
  await say(LESSON[i]);
}

// ---------- 模式切换（位置不丢） ----------
function setMode(m, focus) {
  if (m === S.mode && !focus) return;
  if (m === 'listen') {
    let b = focus;
    if (!b && S.mode === 'read') { const v = $('#view'), y = v.getBoundingClientRect().top + 90; b = ($$('.blk', v).find(el => el.getBoundingClientRect().bottom > y) || {}).id; }
    S.mode = 'listen'; render();
    if (b) { const s = BLK[b].s; if ($('#step-' + s)) { $('#step-' + s).scrollIntoView({ block: 'start' }); toast('听讲 · 第 ' + (s + 1) + ' 步'); } else jumpTo(s); }
    return;
  }
  S.mode = 'read'; render();
  const id = focus || BLOCKS.find(b => b.s === S.cur).id;
  const el = $('#' + id); if (!el) return;
  el.scrollIntoView({ block: 'center' });
  el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 2000);
}

// ---------- 浮层 ----------
function sheet(title, body, acts, sub) {
  $('#overlay').innerHTML = '<div class="scrim" onclick="' + on(closeSheet) + '"></div><div class="sheet" role="dialog" aria-label="' + esc(title) + '"><div class="grab"></div><div class="sh"><b>' + title + '</b>' + (sub ? '<small>' + sub + '</small>' : '') + '</div><div class="sb">' + body + '</div>' + (acts ? '<div class="sf">' + acts.map(a => '<button class="btn ' + (a[2] || '') + '" onclick="' + on(a[1]) + '">' + a[0] + '</button>').join('') + '</div>' : '') + '</div>';
  requestAnimationFrame(() => $('#overlay').classList.add('show'));
}
function closeSheet() { $('#overlay').classList.remove('show'); setTimeout(() => { if (!$('#overlay').classList.contains('show')) $('#overlay').innerHTML = ''; }, REDUCED ? 0 : 260); }
function peek(id) {
  const b = BLK[id], same = BLOCKS.filter(x => x.p === b.p && (x.sec || '') === (b.sec || ''));
  const body = '<div class="peek">' + (b.sec ? '<div class="pblk">3.4.2　Dijkstra 算法或一致代价搜索</div>' : '') + same.map(x => '<div class="pblk b-' + x.t + (x.id === id ? ' tgt' : '') + '">' + (x.t === 'fig' ? FIG : blockText(x)) + '</div>').join('') + '<div class="pno">— ' + b.p + ' —</div></div>';
  sheet('原书 p.' + b.p, body, b.sec ? [['好的', closeSheet, 'pri']] : [['在读书模式打开', () => { closeSheet(); setMode('read', id); }, 'pri'], ['关闭', closeSheet]], b.sec ? '3.4.2 一致代价搜索 · 岔路里读过的原文' : '3.5.2 A* 搜索 · 高亮的是被引用的段落');
  const t = $('.peek .tgt'); if (t) t.scrollIntoView({ block: 'center' });
}
function blockMenu(id) {
  const b = BLK[id]; if (b.t === 'h') return;
  $$('.blk.sel').forEach(e => e.classList.remove('sel')); $('#' + id).classList.add('sel');
  const acts = [
    ['解释这段', () => explain(id)],
    ['从这里开始讲', () => { closeSheet(); setMode('listen', id); }, 'pri'],
    [S.hl.has(id) ? '取消高亮' : '高亮', () => { S.hl.has(id) ? S.hl.delete(id) : S.hl.add(id); closeSheet(); renderView(false); }],
    ['问 AI', () => { closeSheet(); setMode('listen', id); setTimeout(() => { const q = $('#q'); if (q) { q.value = '「' + b.x.slice(0, 14) + '…」'; q.focus(); } }, 120); }]
  ];
  sheet('第 ' + (b.s + 1) + ' 步 · p.' + b.p, '<p class="sp quote">' + blockText(b) + '</p>', acts);
}
function explain(id) {
  const t = EXPLAIN[id] || '这一段在说：' + BLK[id].x.slice(0, 40) + '…… 换句话说，它是第 ' + (BLK[id].s + 1) + ' 步「' + STEPS[BLK[id].s].t + '」的依据 [[' + id + ']]。';
  sheet('解释', '<div class="ai">' + md(t) + '</div>', [['带到听讲里继续问', () => { closeSheet(); setMode('listen', id); }, 'pri'], ['好的', () => { closeSheet(); S.pins[id] = S.pins[id] || { q: '这段在说什么', a: t }; renderView(false); toast('已贴成问答便签'); }]]);
}
function openPin(id) {
  const p = S.pins[id];
  sheet(esc(p.q), '<div class="ai">' + md(p.a) + '</div>', [['在听讲里继续问', () => { closeSheet(); setMode('listen', id); }, 'pri'], ['好的', closeSheet]], '问答便签 · p.' + BLK[id].p);
}
function finish() {
  const cards = [['A* 的评价函数是什么？', 'f(n) = g(n) + h(n)'], ['什么是可容许的启发式？', '从不高估到达目标的真实代价'], ['一致性和可容许性是什么关系？', '一致 ⇒ 可容许，反之不一定']];
  S.cardSel = S.cardSel || cards.map(() => true);
  const row = (c, i) => '<button class="ck' + (S.cardSel[i] ? ' on' : '') + '" onclick="' + on(() => { S.cardSel[i] = !S.cardSel[i]; finish(); }) + '"><span class="bx">' + I('check') + '</span><span class="grow"><b>' + esc(c[0]) + '</b><small>' + esc(c[1]) + '</small></span></button>';
  sheet('3.5.2 学完了', '<p class="sp">A* 按 f = g + h 扩展；h 可容许时树搜索最优，一致时图搜索也最优。</p><div class="sub">卡点</div><p class="sp stuck">' + I('flag') + '为什么图搜索需要一致性而不只是可容许</p><div class="sub">闪卡草稿 · 默认全选</div>' + cards.map(row).join(''), [['保存，进入 3.5.3', () => { closeSheet(); S.finished = true; renderView(false); toast('已保存 ' + S.cardSel.filter(Boolean).length + ' 张闪卡，进度移到 3.5.3'); }, 'pri']], '摘要 · 卡点 · 闪卡');
}
let toastT;
function toast(t) { if (!t) return; const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2200); }

// ---------- 外部控制 ----------
function setTheme(t) { document.documentElement.dataset.theme = t; $$('.side .tg button').forEach(b => b.classList.toggle('on', b.dataset.t === t)); }
function start() {
  reset();
  setTheme(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  render();
  const m = location.hash.slice(1); if (m === 'read') setMode('read');
}
document.addEventListener('DOMContentLoaded', start);

</script>
</body>
</html>
