  await say([{ k: 'ai', t: '回到 A*：刚才讲到第 ' + (st.cur + 1) + ' 步「' + st.steps[st.cur].t + '」。' + (d.sec === '3.4.2' && !d.reviewing ? '记住刚才的结论，h≡0 时 A* 就是一致代价搜索。' : '') + (st.phase === 'ready' ? '这一节已经讲完，可以进入下一节了。' : '准备好了就点「懂了，下一步」。') }]);
}

// ---------- 自由提问 ----------
async function sendText() {
  const st = ST(), inp = $('#cin');
  const text = ((inp && inp.value) || '').trim();
  if (!text || !guard()) return;
  inp.value = '';
  const quote = st.quote, qb = quote ? BLK[quote] : null; st.quote = null;
  st.asked++;
  if (st.detour && /^回|主线/.test(text)) { user(text); return backMain(true); }
  if (st.detour && st.detour.reviewing && /清楚|懂了|明白/.test(text)) return reviewOk(text);
  if (!st.detour) {
    const dsec = qb && DETOURS[qb.sec] && qb.sec !== st.sec ? qb.sec : Object.keys(DETOURS).find(k => DETOURS[k].match.test(text));
    if (dsec && dsec !== st.sec) return enterDetour(dsec, text, quote);
  }
  user(text, quote ? { quote } : null);
  if (st.detour && /快|效率|更少|一定/.test(text)) return say([{ k: 'ai', t: '不一定更快，但 h 越准，A* 扩展的结点越少；h 可容许时两者找到的都是最优解 [[b:b1025]]。h≡0 时两者扩展的结点完全一样 [[b:b0902]]。' }]);
  const hit = FREE.find(f => f.match.test(text + (qb ? qb.x : '')));
  if (hit) return say([{ k: 'ai', t: hit.a }]);
  if (qb) return say([{ k: 'ai', t: '这段在说：' + qb.gist + ' [[b:' + qb.id + ']]\n\n（原型演示：实际回答会结合你的问题和这一段的上下文。）' }]);
  say([{ k: 'ai', t: GENERIC }]);
}
function stopAnswer() { const st = ST(); if (st.busy) st.stopped = true; }
function retryAnswer(m) {
  if (ST().busy) return;
  const tgt = target(); [m.partial, m].forEach(x => { const i = tgt.indexOf(x); if (i >= 0) tgt.splice(i, 1); });
  S.flags.aiError = false;
  say([Object.assign({}, m.raw)]);
}

// ---------- 路线图：点某一步 ----------
function tapStep(i) {
  const st = ST();
  if (st.busy) return showToast('正在回答…');
  if (st.mode !== 'listen') setMode('listen');
  if (st.ss[i] === 'done' && i === 0 && !st.histOpen && !$('#step-0')) { st.histOpen = true; refresh(); }
  const el = $('#step-' + i);
  if (el) return el.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' });
  if (!hasScript()) return showToast(NO_SCRIPT);
  modal({ title: '从第 ' + (i + 1) + ' 步开始讲？', body: '「' + esc(st.steps[i].t) + '」· ' + st.steps[i].p + '。中间没讲的步骤会留着，随时可以回来讲。', ok: '开始讲', onOk: () => { setTimeout(() => jumpTo(i), 200); } });
}
function jumpTo(i) {
  closeOverlay(true);

  if (st.mode !== 'listen') { st.mode = 'listen'; refresh(); }
  teachStep(i);
}
function finishSection() { if (ST().busy) return showToast('正在回答…'); if (!hasScript()) return showToast(NO_SCRIPT); go('done'); }

// ---------- 模式切换：读书 ⇄ 听讲，位置不丢（05 §9） ----------
function stepOfBlock(id) { return ST().steps.findIndex(s => s.blocks.includes(id)); }
function setMode(m, focus) {
  const st = ST();
  if (cur().name !== 'study') { st.mode = m; st.focus = focus; return openStudy(); }
  if (m === st.mode && !focus) return;
  if (m === 'listen') {
    let b = focus;
    if (!b && st.mode === 'read') { const v = $('#view'), y = $('#head').getBoundingClientRect().bottom + 40; b = ($$('.blk', v).find(el => el.getBoundingClientRect().bottom > y) || {}).id; }
    st.mode = 'listen'; render(true);
    const v = $('#view'); v.scrollTop = v.scrollHeight;
    const s = b ? stepOfBlock(b) : -1;
    if (s < 0) return;
    const head = $('#step-' + s);
    if (head && st.ss[s] !== 'todo') { head.scrollIntoView({ block: 'start' }); if (!focus) showToast('听讲 · 第 ' + (s + 1) + ' 步'); }
    else if (focus) { if (st.busy) return; if (st.ss[s] === 'now') return showToast('正在讲第 ' + (s + 1) + ' 步'); jumpTo(s); }
    return;
  }
  st.mode = 'read'; render(true);
  flashBlock(focus || (st.steps[st.cur] || { blocks: [] }).blocks[0]);
}
function flashBlock(id) {
  const el = id && document.getElementById(id); if (!el) return;
  const v = $('#view'); v.scrollTop += el.getBoundingClientRect().top - v.getBoundingClientRect().top - v.clientHeight / 2 + 40;
  el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 2000);
}

/* Pagewise Win11 风原型 · 听讲 / 读书页面：SelectorBar（读书 | 听讲 + AI 看到的内容）、步骤卡片、岔路条、Copilot 式 thread、快捷动作 + 彩虹输入框、原文预览、路线图、AI 看到的内容 */

      '<input id="cin" autocomplete="off" aria-label="提问"' + (S.flags.noAI ? ' disabled placeholder="先配置 AI 服务"' : ' placeholder="' + (st.detour ? '在岔路里继续问，或说「回到主线」' : '问点什么，或说「讲慢一点」') + '"') + '>' +

};
// 步骤卡片（StepProgress）：上行「第 k 步 + 步名 + 页码 + 路线图按钮」，中间分段条（已讲强调色、当前彩虹、跳过虚线），下行步名（可点）
function stepper(st) {

  const k = st.phase === 'ready' ? st.n - 1 : st.cur, s = st.steps[k] || {};

function quickActions(st) {
  if (st.detour && st.detour.reviewing) return [['清楚了，继续 ' + st.sec, reviewOk, 'dt', 'check'], ['还是不太懂', reviewAgain, '', 'question']];
  if (st.detour) return [['回到主线 ' + st.sec, () => backMain(), 'dt', 'branch'], ['看 ' + st.detour.sec + ' 原文', () => go('reader', { sec: st.detour.sec }), '', 'book']];
  if (st.phase === 'resume') return [];
  const alt = [['换个说法', () => actAlt('re'), '', 'alt'], ['举个例子', () => actAlt('ex'), '', 'bulb']];
  if (st.msgs.some(m => m.k === 'quiz' && m.pick == null)) return alt.concat([['看原文', actSource, '', 'book']]);
  if (st.phase === 'ready') return [['懂了，下一节', finishSection, 'pri', 'check'], ['再讲一遍这一节', () => showToast('原型里不演示重讲'), '', 'retry'], ['看原文', actSource, '', 'book']];
  const last = nextIndex(st) < 0, step = st.steps[st.cur] || {};
  const hasEq = step.blocks && step.blocks.some(id => BLK[id].t === 'eq' || /\$/.test(BLK[id].x));
  const c = [[last ? '懂了' : '懂了，下一步', actNext, 'pri', 'check']].concat(alt);
  if (step.kind === 'derivation' || step.kind === 'definition' || hasEq) c.push(['展开推导', () => actAlt('dv'), '', 'derive']);
  if (!last) c.push(['这步熟，跳过', actSkip, '', 'skip']);
  return c.concat([['考考我', actQuiz, '', 'question'], ['看原文', actSource, '', 'book']]);
}

'use strict';
function readTool(sec) {
  const st = S.study, s = S.sec[sec];
  const hint = s.status === 'done' ? '已学' : sec === st.sec ? (st.phase === 'resume' ? '讲完第 1 步' : '讲到第 ' + (st.cur + 1) + ' 步') : '';
  return '<div class="rdtool">' + segHtml([['orig', '原版'], ['flow', '重排']], S.readerMode, k => { S.readerMode = k; refresh(); }) + '<span class="pgi">' + (hint ? '<b>' + hint + '</b><br>' : '') + '点段落可解释、提问</span></div>';
}
function readerMarks(sec) {
  const st = S.study, s = S.sec[sec], heard = new Set(), now = new Set();
  if (s.status === 'done') blocksOfSec(sec).forEach(b => heard.add(b.id));
  if (sec === st.sec) st.steps.forEach((x, i) => {
    if (st.ss[i] === 'done') x.blocks.forEach(id => heard.add(id));
    if (i === st.cur && st.ss[i] === 'now' && st.phase !== 'resume') x.blocks.forEach(id => now.add(id));
  });
  return { heard, now };
}
function blockHtml(b, mk) {
  const cl = ['blk', b.t === 'title' ? 'b-title' : b.t === 'eq' ? 'b-eq' : '', mk.heard.has(b.id) ? 'heard' : '', mk.now.has(b.id) ? 'now' : '', S.hl[b.id] ? 'hl' : ''].join(' ');
  const inner = b.t === 'image' ? figHtml(b.fig) : b.t === 'eq' ? '<span class="math blk">' + esc(plain(b.x)) + '</span>' : inline(b.x);
  const pin = S.pins[b.id];
  return '<div class="' + cl + '" id="' + b.id + '" onclick="' + on(e => blockMenu(e, b.id)) + '">' + inner + '</div>' +
    (pin ? '<button class="pin" onclick="' + on(() => openPin(b.id)) + '">' + I('pin') + '<span>' + esc(pin.q) + '</span>' + I('chev') + '</button>' : '');
}
function readerBody(sec) {
  const s = S.sec[sec], st = S.study, main = sec === st.sec, mk = readerMarks(sec), ch = chapterOf(sec), par = S.sec[s.parent];
  const g = main && GUIDE[sec];
  let h = g ? '<button class="guide' + (st.guide ? ' open' : '') + '" aria-expanded="' + st.guide + '" onclick="' + on(() => { st.guide = !st.guide; refresh(); }) + '"><span class="lbl">' + I('spark') + '本节导读</span><span class="gt' + (st.guide ? '' : ' one') + '">' + esc(st.guide ? g.full : g.one) + '</span>' + I('chevDown') + '</button>' : '';
  h += '<div class="pages">';
  if (S.readerMode === 'flow') {
    h += '<article class="page">';
    let lastP = 0;
    blocksOfSec(sec).forEach(b => {
      if (b.p !== lastP) { if (lastP) h += '<div class="pno">— ' + lastP + ' —</div>'; lastP = b.p; }
      h += blockHtml(b, mk);
    });
    h += '<div class="pno">— ' + lastP + ' —</div></article>';
  } else {
    for (let pg = s.p0; pg <= s.p1; pg++) {
      const bs = BLOCKS.filter(b => b.p === pg && b.sec === sec);
      h += '<article class="page orig" id="pg' + pg + '"><div class="run"><span>' + esc(secName(ch.id)) + '</span><span>' + esc(par ? secName(par.id) : '') + '</span></div>' +
        (bs.length ? bs.map(b => blockHtml(b, mk)).join('') : '<div class="pph">这一页的正文没有放进原型<br>（原型只为 3.4.2、3.5.1、3.5.2 写了示意内容）</div>') + '<div class="pno">' + pg + '</div></article>';
    }
  }
  h += '</div>';
  if (main && hasScript()) h += '<div class="readend card">' + T3('check') + '<div class="grow"><b>读完这一节</b><small>和听讲一样生成摘要和闪卡草稿</small></div><button class="btn pri sm" onclick="finishSection()">读完了</button></div>';
  return h + '<div class="rfoot"><span><i class="lg heard"></i>听讲已讲过</span><span><i class="lg now"></i>正在讲</span><span><i class="lg hl"></i>高亮</span><br>示意内容，不是原书文字</div>';
}

  cards: [

    { f: '什么是可容许的启发式函数？', b: '从不高估到达目标的真实代价（乐观）。h 可容许时，A* 代价最优。' },
    { f: '一致性的定义？和可容许的关系？', b: 'h(n) ≤ c(n, a, n′) + h(n′)。一致 ⇒ 可容许，反之不一定。' },
    { f: 'h(n) ≡ 0 时 A* 变成什么？', b: '一致代价搜索（Dijkstra 算法）。', detour: true },
    { f: '最优高效（optimally efficient）指什么？', b: '在同一启发式、保证最优的算法中，A* 扩展的结点数几乎最少。' }

      lab('段落菜单 SelectionMenu（点下面这段）') + '<div class="page" style="border-radius:16px"><div class="blk" id="kitblk" onclick="' + on(e => { e.stopPropagation(); const el = e.currentTarget; el.classList.add('sel'); editMenu(el, [['解释', () => {}, 'spark', 'ai'], ['翻译', () => {}, 'globe'], ['问 AI', () => {}, 'teach'], ['从这里讲', () => {}, 'listen'], ['高亮', () => {}, 'edit'], ['笔记', () => {}, 'note']]); setTimeout(() => el.classList.add('sel'), 0); }) + '">可容许的启发式函数从不高估到达目标的代价，因此是乐观的。</div></div>');
    // 图标
    h += sec('icon', '图标', 'Icon（线条，I()）· Fluent 3D（T3()）', lab('线条图标 · 1.5 线宽 · 24 网格') + '<div class="icgrid">' + Object.keys(ICONS).map(n => '<div>' + I(n) + '<span>' + n + '</span></div>').join('') + '</div>' +
      lab('Fluent 3D 图标 · 28 网格 · 外框 40/32/64') + '<div class="icgrid i3g">' + Object.keys(ICONS3).map(n => '<div>' + T3(n, 'sm') + '<span>' + n + '</span></div>').join('') + '</div>');
    return h;
  },
  after() {
    const cs = getComputedStyle(document.documentElement);
    $$('#view [data-var]').forEach(el => { el.textContent = cs.getPropertyValue(el.dataset.var).trim().replace(/\s+/g, ' ').slice(0, 40); });
  }
};

/* Pagewise Win11 风原型 · 原型控制台（Win11 窗口：深浅色 / 场景 / 页面 / 页面状态）、启动 */
'use strict';
const PAGES = [
  ['今天', [['today', '今天'], ['ask', '问书架'], ['stats', '学习记录'], ['welcome', '新手引导', { step: 0 }]]],
  ['书架', [['shelf', '书架'], ['importSet', '解析设置', { i: 1 }], ['parse', '解析进度', { book: 'slm' }], ['map', '书的地图', { book: 'aima' }]]],
  ['学习', [['study', '听讲'], ['read', '读书'], ['reader', '读书·其他小节', { sec: '3.4.2' }], ['done', '本节小结']]],
  ['复习 · 笔记', [['review', '复习'], ['rv', '复习闪卡'], ['notes', '笔记'], ['notesBook', '笔记·按节'], ['noteDetail', '笔记·3.4.2', { sec: '3.4.2' }]]],
  ['我的', [['me', '我的'], ['meMineru', '解析服务'], ['meAI', 'AI 服务'], ['meAIEdit', '编辑服务', { id: 'a1' }], ['mePrefs', '讲解偏好'], ['meAppearance', '外观'], ['meStorage', '存储与备份'], ['about', '关于'], ['kit', '组件库']]]
];
const ALL_PAGES = PAGES.flatMap(g => g[1]);
function openPage(name, p) {
  if (ROOTS.includes(name)) return tab(name);
  if (name === 'study' || name === 'read') { S.study.mode = name === 'read' ? 'read' : 'listen'; R.stack = [{ name: 'today', p: {} }, { name: 'map', p: { book: 'aima' } }]; return go('study'); }
  const root = name.startsWith('me') || name === 'about' || name === 'kit' ? 'me' : name === 'rv' ? 'review' : name.startsWith('note') ? 'notes' : ['ask', 'stats', 'welcome'].includes(name) ? 'today' : 'shelf';
  R.stack = [{ name: root, p: {} }];
  if (name === 'done') R.stack.push({ name: 'map', p: { book: 'aima' } }, { name: 'study', p: {} });
  if (name === 'kit') R.stack.push({ name: 'about', p: {} });
  go(name, p ? clone(p) : {});
}
const SCEN = [
  ['续学', '隔 3 天打开，先回顾卡点', () => { resetStudy(); S.daysAway = 3; openPage('study'); }],
  ['岔路', '讲 A* 时问一致代价搜索', () => { resetStudy(1); openPage('study'); setTimeout(() => { $('#cin').value = '这跟前面的一致代价搜索有什么关系？'; sendText(); }, 300); }],
  ['点引用', '原文预览浮层', () => { resetStudy(1); openPage('study'); setTimeout(() => peek('b1025'), 350); }],
  ['路线图', '点第 4 步，从这里开始讲', () => { resetStudy(1); openPage('study'); setTimeout(() => openRoadmap(), 350); }],
  ['小测', '讲完最后一步，做本节小测', () => { resetStudy(3, { quiz: true }); openPage('study'); }],
  ['读书模式', '讲过的段落、便签、导读', () => { resetStudy(2); S.readerMode = 'flow'; openPage('read'); }],
  ['段落菜单', '点一段：解释、从这里讲', () => { resetStudy(2); S.readerMode = 'flow'; openPage('read'); setTimeout(() => { flashBlock('b1026'); setTimeout(() => { const el = $('#b1026'); if (el) el.click(); }, 120); }, 400); }],
  ['学完一节', '摘要、卡点、闪卡草稿', () => { resetStudy(3, { ready: true }); openPage('done'); }],
  ['问书架', '跨书问「A* 和 Dijkstra」', () => { S.ask = { q: '', state: 'idle' }; openPage('ask'); setTimeout(() => runAsk('A* 和 Dijkstra 是什么关系？'), 300); }],
  ['首次启动', '欢迎 → AI → MinerU → 偏好', () => { S.flags.firstRun = true; openPage('welcome', { step: 0 }); }],
  ['导入新书', '扫描版 744 页，分 4 片', () => { tab('shelf'); openImport(); }],
  ['解析失败', 'Token 过期，解析暂停', () => { S.sim.tokenExpired = true; tab('shelf'); go('importSet', { i: 0 }); showToast('已模拟 Token 过期，点「开始解析」看看'); }],
  ['复习闪卡', '点卡片 3D 翻面', () => openPage('rv')],
  ['AI 出错', '回答到一半断开，重试', () => { S.flags.aiError = true; resetStudy(1); openPage('study'); setTimeout(() => actAlt('ex'), 350); }],
  ['导出笔记', 'Markdown / Anki', () => { openPage('notesBook'); setTimeout(openExport, 100); }],
  ['组件库', '所有组件和状态', () => openPage('kit')]
];
// 页面状态（03 §12）：打开后去对应页面看
const FLAGS = [
  ['emptyShelf', '空书架', '今天 / 书架的空状态', 'today'],
  ['noAI', '未配置 AI 服务', '听讲说明卡、我的 → AI 服务', 'study'],
  ['noToken', '未配置 MinerU Token', '解析设置底部按钮、解析服务', 'importSet'],
  ['tokenExpired', 'MinerU Token 过期', '开始解析后暂停', 'importSet'],
  ['offline', '断网', '发送时提示，消息留在输入框', 'study'],
  ['aiError', 'AI 出错', '下一次回答中途断开', 'study'],
  ['doneLoading', '小结生成中', '骨架屏', 'done'],
  ['doneError', '小结生成失败', '可重试，也可以手写', 'done']
];
const flagVal = k => k === 'tokenExpired' ? S.sim.tokenExpired : S.flags[k];
function setFlag(k, v) {
  if (k === 'tokenExpired') S.sim.tokenExpired = v; else S.flags[k] = v;
  if (k === 'doneLoading' && v) S.flags.doneError = false;
  if (k === 'doneError' && v) S.flags.doneLoading = false;
  const f = FLAGS.find(x => x[0] === k), pg = ALL_PAGES.find(x => x[0] === f[3]);
  if (v) openPage(pg[0], pg[2] || (f[3] === 'importSet' ? { i: 0 } : null)); else refresh();
}
function renderConsole() {
  const c = cur(), pg = c.name === 'study' && S.study.mode === 'read' ? 'read' : c.name;
  $('#console').innerHTML = '<h1>Windows 11 · 2026</h1><div class="lead">Pagewise 的完整可交互原型，依据 <a href="explore/windows11-2026.html">explore/windows11-2026.html</a>：壁纸透过 Mica 染色、Copilot 彩虹、药丸按钮、16–20px 圆角卡片、Fluent 3D 彩色图标、悬浮亚克力 Tab 栏。比其他皮肤多了「今天」Tab、问书架、学习记录、新手引导、组件库和各种空 / 错误状态。</div>' +
    '<div class="tg">' + [['system', '跟随系统'], ['light', '浅色'], ['dark', '深色']].map(([k, l]) => '<button class="' + (S.theme === k ? 'on' : '') + '" onclick="setTheme(\'' + k + '\');refresh()">' + l + '</button>').join('') + '</div>' +
    '<h2>场景</h2><div class="jump">' + SCEN.map(([t, d], i) => '<button onclick="SCEN[' + i + '][2]()">' + t + '<small>' + d + '</small></button>').join('') + '</div>' +
    '<h2>页面 · ' + ALL_PAGES.length + '</h2><div class="pgs">' + PAGES.map(([g, list]) => '<div class="gl">' + g + '</div>' + list.map(([k, l, p]) => '<button class="' + (pg === k ? 'on' : '') + '" onclick="openPage(\'' + k + '\',' + (p ? esc(JSON.stringify(p)) : 'null') + ')">' + l + '</button>').join('')).join('') + '</div>' +
    '<h2>页面状态</h2><div class="flags">' + FLAGS.map(([k, l, d]) => '<label><span class="grow">' + l + '<small>' + d + '</small></span><span class="sw' + (flagVal(k) ? ' on' : '') + '" role="switch" aria-checked="' + !!flagVal(k) + '" onclick="setFlag(\'' + k + '\',' + !flagVal(k) + ')"></span></label>').join('') + '</div>' +
    '<h2>试试这些</h2><p>· 今天页点彩虹框「问问你书架上的书」，问「A* 和 Dijkstra 是什么关系？」。</p><p>· 听讲里输入「这跟前面的一致代价搜索有什么关系？」进入岔路，再点「回到主线」看折叠。</p><p>· 点步骤卡片打开本节路线图；点讲解里的 <b>p.103</b> 弹出原书预览，浮层按住顶部下滑关闭。</p><p>· 读书里点段落弹出亚克力命令栏；问答便签是黄色胶囊。</p><p>· 我的 → 关于 → 组件库：所有组件、Token 和图标。</p>' +
    '<h2>说明</h2><p>书名和章节目录来自《人工智能：现代方法（第4版）》；页码、原文、讲解和闪卡都是示意内容。AI 回答是预先写好的脚本。实现说明见 prototype-win11/README.md。</p>' +
    '<button class="rst" onclick="reset();setTheme(S.theme);setFont(S.fontSize);tab(\'today\')">重置原型</button>';
}

// ---------- 启动 ----------
reset();
startParse(bookOf('slm'));
setTheme('system');
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.theme === 'system') setTheme('system'); });
$('#view').addEventListener('scroll', onScroll, { passive: true });
(function boot() {
  const want = decodeURIComponent(location.hash.slice(1));
  const pg = ALL_PAGES.find(x => x[1] === want || x[0] === want);
  if (pg) openPage(pg[0], pg[2]); else render(true);
})();

</script>
