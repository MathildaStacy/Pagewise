<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagewise 可交互原型 · Win11 风</title>
<style>
/*CSS*/
</style>
</head>
<body>
<!-- Fluent 3D 图标和 Copilot 彩虹用到的渐变（icons.js 的 I3 引用这些 id） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gai" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2B7BFF"/><stop offset=".45" stop-color="#7C5CFF"/><stop offset=".75" stop-color="#E2549F"/><stop offset="1" stop-color="#FF9A4D"/></linearGradient>
    <linearGradient id="gline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2B7BFF"/><stop offset=".6" stop-color="#7C5CFF"/><stop offset="1" stop-color="#E2549F"/></linearGradient>
    <linearGradient id="gfire" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD25A"/><stop offset=".55" stop-color="#FF8A3D"/><stop offset="1" stop-color="#E8432E"/></linearGradient>
    <linearGradient id="gblue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7FB6FF"/><stop offset="1" stop-color="#2D6BF0"/></linearGradient>
    <linearGradient id="gpurple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C6A8FF"/><stop offset="1" stop-color="#7A4BE6"/></linearGradient>
    <linearGradient id="gpink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9EB8"/><stop offset="1" stop-color="#E23C6E"/></linearGradient>
    <linearGradient id="gyellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE97A"/><stop offset="1" stop-color="#FFB020"/></linearGradient>
    <linearGradient id="ggreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#66D9A8"/><stop offset="1" stop-color="#109E68"/></linearGradient>
    <linearGradient id="gorange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC27A"/><stop offset="1" stop-color="#F07A1A"/></linearGradient>
    <linearGradient id="gred" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9A8A"/><stop offset="1" stop-color="#D63A2A"/></linearGradient>
    <linearGradient id="gteal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6FE3D6"/><stop offset="1" stop-color="#0E9A8C"/></linearGradient>
    <linearGradient id="ggray" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D5D9E2"/><stop offset="1" stop-color="#8A92A6"/></linearGradient>
    <linearGradient id="gpaper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6EAF2"/></linearGradient>
    <linearGradient id="gstart" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4FB4FF"/><stop offset="1" stop-color="#0A62D8"/></linearGradient>
  </defs>
</svg>

<div class="stage">
  <div class="phone" id="phone">
    <main id="view"></main>
    <header id="head">
      <div class="sbar"><span class="n">21:40</span><span class="cam"></span><span class="r"><svg viewBox="0 0 24 24"><path d="M12 21L1 8.5C3.9 5.7 7.8 4 12 4s8.1 1.7 11 4.5z"/></svg><svg viewBox="0 0 24 24"><path d="M2 22h20V2z"/></svg><svg viewBox="0 0 24 24"><path d="M15.7 4H14V2h-4v2H8.3C7.6 4 7 4.6 7 5.3v15.3c0 .8.6 1.4 1.3 1.4h7.3c.8 0 1.4-.6 1.4-1.3V5.3C17 4.6 16.4 4 15.7 4z"/></svg></span></div>
      <div id="nav"></div>
      <div id="top"></div>
    </header>
    <div id="dock"></div>
    <div id="fab"></div>
    <nav id="tabbar" aria-label="主导航"></nav>
    <div id="overlay"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div class="homebar"></div>
  </div>
  <!-- 说明窗：Win11 窗口（Mica 标题栏 + 最小化 / 最大化 / 关闭），里面是原型控制台 -->
  <aside class="console" id="consoleWin">
    <div class="tb"><b class="app"></b><span>Pagewise · 原型控制台</span><i><svg viewBox="0 0 10 10"><path d="M0 5h10"/></svg></i><i><svg viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" rx="1.5"/></svg></i><i class="x"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></i></div>
    <div class="bd" id="console"></div>
  </aside>
</div>

<!-- 桌面任务栏（只是舞台装饰） -->
<div class="taskbar" aria-hidden="true">
  <span class="tk"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8.5" height="8.5" rx="1.2" fill="url(#gstart)"/><rect x="12.5" y="3" width="8.5" height="8.5" rx="1.2" fill="url(#gstart)"/><rect x="3" y="12.5" width="8.5" height="8.5" rx="1.2" fill="url(#gstart)"/><rect x="12.5" y="12.5" width="8.5" height="8.5" rx="1.2" fill="url(#gstart)"/></svg></span>
  <span class="srch"><svg class="i" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg><span>搜索</span></span>
  <span class="tk"><svg viewBox="0 0 28 28"><path d="M14 2.5c.6 0 .9.3 1.1.9l1.6 4.9c.3 1 1.2 1.9 2.2 2.2l4.9 1.6c.6.2.9.5.9 1.1s-.3.9-.9 1.1l-4.9 1.6c-1 .3-1.9 1.2-2.2 2.2l-1.6 4.9c-.2.6-.5.9-1.1.9s-.9-.3-1.1-.9l-1.6-4.9c-.3-1-1.2-1.9-2.2-2.2l-4.9-1.6c-.6-.2-.9-.5-.9-1.1s.3-.9.9-1.1l4.9-1.6c1-.3 1.9-1.2 2.2-2.2l1.6-4.9c.2-.6.5-.9 1.1-.9z" fill="url(#gai)"/></svg></span>
  <span class="tk"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4.5l2 2H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z" fill="url(#gyellow)"/><path d="M3 10h18" stroke="#E09A0E" stroke-width="1"/></svg></span>
  <span class="tk on"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" fill="url(#gai)"/><path d="M12 8.5c-1.3-1-3.2-1.3-5-1v8c1.8-.3 3.7 0 5 1 1.3-1 3.2-1.3 5-1v-8c-1.8-.3-3.7 0-5 1zM12 8.5v8" stroke="#fff" stroke-width="1.4" fill="none" stroke-linejoin="round"/></svg></span>
  <span class="clock">21:40<br>2026/10/29</span>
</div>
<script>
/*JS*/
</script>
</body>
</html>
