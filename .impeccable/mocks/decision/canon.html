<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Pagewise · Canon (Material 3)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;500&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --surface: #FEF7FF; --on-surface: #1D1B20; --on-surface-variant: #49454F;
    --primary: #6750A4; --on-primary: #FFFFFF; --primary-container: #EADDFF;
    --secondary-container: #E8DEF8; --on-secondary-container: #1D192B;
    --surface-container: #F3EDF7; --surface-container-high: #ECE6F0;
    --outline: #79747E; --outline-variant: #CAC4D0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 390px; height: 844px; overflow: hidden; margin: 0; }
  body {
    position: relative; display: flex; flex-direction: column;
    background: var(--surface); color: var(--on-surface);
    font-family: "Roboto", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  svg { display: block; fill: currentColor; flex: none; }

  /* Status bar */
  .status { height: 28px; padding: 0 20px 0 24px; display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; font-weight: 500; letter-spacing: .1px; }
  .status .sys { display: flex; align-items: center; gap: 6px; }

  /* Small top app bar */
  .appbar { height: 64px; display: flex; align-items: center; padding: 0 4px; }
  .icon-btn { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
    border-radius: 24px; color: var(--on-surface); }
  .appbar .titles { flex: 1; min-width: 0; padding: 0 4px; }
  .appbar .title { font-size: 22px; line-height: 28px; font-weight: 400; white-space: nowrap; }
  .appbar .sub { font-size: 12px; line-height: 16px; letter-spacing: .5px; color: var(--on-surface-variant); white-space: nowrap; }

  /* Segmented button */
  .seg-wrap { height: 48px; padding: 4px 16px; }
  .seg { height: 40px; display: flex; border: 1px solid var(--outline); border-radius: 20px; overflow: hidden;
    font-size: 14px; font-weight: 500; letter-spacing: .1px; }
  .seg > div { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--on-surface); }
  .seg > div + div { border-left: 1px solid var(--outline); }
  .seg .on { background: var(--secondary-container); color: var(--on-secondary-container); }

  /* Chips */
  .chip { height: 32px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; flex: none;
    border: 1px solid var(--outline); border-radius: 8px; background: transparent; color: var(--on-surface-variant);
    font-size: 14px; font-weight: 500; letter-spacing: .1px; white-space: nowrap; }
  .chip svg { width: 18px; height: 18px; }
  .chip.done { color: var(--on-surface); }
  .chip.sel { background: var(--secondary-container); border-color: transparent; color: var(--on-secondary-container); }
  .chip.filled { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }

  .steps { height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 16px; overflow: hidden; }

  /* Lecture content */
  main { flex: 1; min-height: 0; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 16px; overflow: hidden; }
  .body { font-size: 16px; line-height: 24px; letter-spacing: .5px; }
  .body .chip { height: 28px; margin-left: 4px; padding: 0 10px; font-size: 12px; vertical-align: 1px; color: var(--primary); }
  .card { border-radius: 12px; padding: 16px; }
  .card .label { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: .5px; margin-bottom: 8px; }
  .outlined { border: 1px solid var(--outline-variant); background: var(--surface); }
  .outlined .label { color: var(--primary); }
  .outlined .quote { font-family: "Noto Serif SC", "Roboto", serif; font-size: 17px; line-height: 28px; letter-spacing: .3px; }
  .tonal { background: var(--secondary-container); color: var(--on-secondary-container); }
  .tonal .text { font-size: 16px; line-height: 24px; letter-spacing: .5px; }

  /* Bottom: suggestion chips + input */
  .bottom { background: var(--surface-container); border-radius: 28px 28px 0 0; padding: 12px 0 0; }
  .suggest { height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 16px; overflow: hidden; }
  .suggest .chip { padding: 0 12px; }
  .input { margin: 4px 16px 0; height: 56px; display: flex; align-items: center; padding-left: 20px;
    background: var(--surface-container-high); border-radius: 28px; }
  .input .ph { flex: 1; min-width: 0; font-size: 14px; letter-spacing: .25px; color: var(--on-surface-variant);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .input .icon-btn { color: var(--on-surface-variant); }
  .send { width: 40px; height: 40px; margin: 0 8px 0 0; border-radius: 20px; background: var(--primary); color: var(--on-primary);
    display: flex; align-items: center; justify-content: center; }
  .gesture { height: 24px; display: flex; align-items: center; justify-content: center; }
  .gesture i { width: 108px; height: 4px; border-radius: 2px; background: var(--on-surface); opacity: .8; }
</style>
</head>
<body>
  <div class="status">
    <span>21:40</span>
    <span class="sys">
      <svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 21 .5 8.5C3.6 5.7 7.6 4 12 4s8.4 1.7 11.5 4.5L12 21z"/></svg>
      <svg width="16" height="16" viewBox="0 0 24 24"><path d="M2 22 22 2v20H2z"/></svg>
      <svg width="20" height="16" viewBox="0 0 24 24"><path d="M16 3h-2V2h-4v1H8a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 7H8V5h8v5z" transform="rotate(90 12 12)" opacity=".4"/><path d="M6 8h9v8H6z"/></svg>
    </span>
  </div>

  <div class="appbar">
    <div class="icon-btn"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></div>
    <div class="titles">
      <div class="title">3.5.2 A*搜索</div>
      <div class="sub">人工智能：现代方法 · p.102–106</div>
    </div>
    <div class="icon-btn"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></div>
  </div>

  <div class="seg-wrap">
    <div class="seg">
      <div>读书</div>
      <div class="on"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>听讲</div>
    </div>
  </div>

  <div class="steps">
    <span class="chip done"><svg viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>1 A* 的直觉</span>
    <span class="chip sel">2 可容许的启发式</span>
    <span class="chip">3 一致性</span>
    <span class="chip">4 最优性证明</span>
  </div>

  <main>
    <p class="body">答案取决于 h。书里给的条件叫可容许的（admissible）：h 从不高估到终点的真实代价。<span class="chip">p.103</span></p>
    <section class="card outlined">
      <div class="label">原文 · p.103</div>
      <p class="quote">如果启发式函数 h(n) 从不高估到达目标的代价，则称 h(n) 是可容许的。</p>
    </section>
    <section class="card tonal">
      <div class="label">补充推导</div>
      <p class="text">设 C* 为最优解代价。h 可容许时，最优路径上任一结点 n 都满足 f(n) = g(n) + h(n) ≤ C*。</p>
    </section>
  </main>

  <div class="bottom">
    <div class="suggest">
      <span class="chip filled">懂了，下一步</span>
      <span class="chip">换个说法</span>
      <span class="chip">展开推导</span>
      <span class="chip">考考我</span>
    </div>
    <div class="input">
      <span class="ph">问点什么，或说"回到 3.4.2"…</span>
      <div class="icon-btn"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg></div>
      <div class="send"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg></div>
    </div>
    <div class="gesture"><i></i></div>
  </div>
</body>
</html>
